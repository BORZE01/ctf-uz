<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasdiqlash — CTF.UZ</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/preloader.css">
</head>
<body>

<div class="girih-bg"></div>

<header class="header">
    <a href="/" class="logo">
        <div class="logo-mark">CU</div>
        <div class="logo-text">CTF<span>.UZ</span></div>
    </a>
</header>

<div class="container-narrow">
    <div class="card-glass fade-in-up" style="max-width: 480px; margin: 60px auto; padding: 40px; text-align: center;">

        <div style="width: 70px; height: 70px; margin: 0 auto 20px; background: linear-gradient(135deg, var(--uz-blue), var(--accent-cyan)); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 2rem; box-shadow: var(--glow-blue);">
            🤖
        </div>

        <h2 style="margin-bottom: 8px; font-family: Manrope; font-weight: 800;">Tasdiqlash</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 28px; line-height: 1.7;">
            Tasdiqlash kodi <strong style="color: var(--uz-blue);">@tasdiqlovchi_ctf_bot</strong> ga yuborildi.
        </p>

        <!-- 6 XONALI KOD INPUT -->
        <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 24px;" id="code-container">
            <input type="text" maxlength="1" class="code-input" data-index="0">
            <input type="text" maxlength="1" class="code-input" data-index="1">
            <input type="text" maxlength="1" class="code-input" data-index="2">
            <input type="text" maxlength="1" class="code-input" data-index="3">
            <input type="text" maxlength="1" class="code-input" data-index="4">
            <input type="text" maxlength="1" class="code-input" data-index="5">
        </div>

        <button id="verify-btn" class="btn btn-primary btn-lg" style="width: 100%;">
            Tasdiqlash →
        </button>

        <div id="verify-message" class="msg-box"></div>

        <!-- QAYTA YUBORISH -->
        <div style="margin-top: 24px; padding-top: 24px; border-top: 1px solid rgba(30,94,255,0.1);">
            <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 12px;">
                Kod kelmaganmi?
            </p>
            <button id="resend-btn" class="btn btn-secondary btn-sm" style="width: 100%;">
                Kodni qayta yuborish
            </button>
            <p style="color: var(--text-muted); font-size: 0.75rem; margin-top: 16px; line-height: 1.6;">
                <strong>@tasd2bot</strong> ga <strong>/start</strong> bosganingizga ishonch hosil qiling.
            </p>
        </div>

    </div>
</div>

<style>
    .code-input {
        width: 56px;
        height: 64px;
        background: var(--surface);
        border: 2px solid rgba(30,94,255,0.15);
        border-radius: 12px;
        color: var(--text-primary);
        font-family: 'JetBrains Mono', monospace;
        font-size: 1.8rem;
        font-weight: 700;
        text-align: center;
        outline: none;
        transition: all 0.2s;
    }
    .code-input:focus {
        border-color: var(--uz-blue);
        box-shadow: 0 0 0 3px rgba(30,94,255,0.15);
    }
    .code-input.filled {
        border-color: var(--accent-cyan);
        background: rgba(0,194,255,0.05);
    }
    @media (max-width: 500px) {
        .code-input { width: 42px; height: 52px; font-size: 1.3rem; }
    }
</style>

<script src="/js/api.js"></script>
<script>
const inputs = document.querySelectorAll('.code-input');

// Auto-next
inputs.forEach((input, i) => {
    input.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '');
        if (e.target.value) {
            e.target.classList.add('filled');
            if (i < 5) inputs[i + 1].focus();
        } else {
            e.target.classList.remove('filled');
        }
    });

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && i > 0) {
            inputs[i - 1].focus();
        }
    });

    input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasted = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
        pasted.split('').forEach((char, idx) => {
            if (inputs[idx]) {
                inputs[idx].value = char;
                inputs[idx].classList.add('filled');
            }
        });
        if (pasted.length === 6) inputs[5].focus();
    });
});

function getCode() {
    return Array.from(inputs).map(i => i.value).join('');
}

// Tasdiqlash
document.getElementById('verify-btn').addEventListener('click', async () => {
    const code = getCode();
    const email = sessionStorage.getItem('pendingEmail');
    const msg = document.getElementById('verify-message');
    const btn = document.getElementById('verify-btn');

    if (!email) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Email topilmadi. Qayta ro\'yxatdan o\'ting.';
        return;
    }

    if (code.length !== 6) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Kod 6 xonali bo\'lishi kerak';
        return;
    }

    btn.disabled = true;
    btn.innerText = 'Tekshirilmoqda...';

    try {
        const res = await API.post('/auth/verify', { email, code });

        if (res.success) {
            msg.className = 'msg-box success';
            msg.innerText = '✅ ' + res.message;
            sessionStorage.removeItem('pendingEmail');
            setTimeout(() => window.location.href = '/dashboard', 1200);
        } else {
            msg.className = 'msg-box error';
            msg.innerText = '❌ ' + res.message;
            inputs.forEach(i => { i.value = ''; i.classList.remove('filled'); });
            inputs[0].focus();
        }
    } catch (err) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Ulanish xatosi';
    } finally {
        btn.disabled = false;
        btn.innerText = 'Tasdiqlash →';
    }
});

// Qayta yuborish
document.getElementById('resend-btn').addEventListener('click', async () => {
    const email = sessionStorage.getItem('pendingEmail');
    const msg = document.getElementById('verify-message');
    const btn = document.getElementById('resend-btn');

    if (!email) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Email topilmadi';
        return;
    }

    btn.disabled = true;
    btn.innerText = 'Yuborilmoqda...';

    try {
        const res = await API.post('/auth/resend-code', { email });

        if (res.success) {
            msg.className = 'msg-box success';
            msg.innerText = '✅ ' + res.message;
        } else {
            msg.className = 'msg-box error';
            msg.innerText = '❌ ' + res.message;
        }
    } catch (err) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Ulanish xatosi';
    } finally {
        btn.disabled = false;
        btn.innerText = 'Kodni qayta yuborish';
    }
});

// Avtomatik fokus
inputs[0].focus();
</script>
    <script src="/js/preloader.js"></script>
</body>
</html>
