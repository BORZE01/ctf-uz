<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber ID — CTF.UZ</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/modern-ui.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- QR Code -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        .cid-header {
            background: linear-gradient(135deg, rgba(37,99,235,0.15), rgba(124,58,237,0.15));
            border: 1px solid rgba(74,127,255,0.25);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
        }
        .cid-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(74,127,255,0.15) 0%, transparent 70%);
            pointer-events: none;
            animation: float 20s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, 30px) scale(1.1); }
        }
        .cid-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #2563EB;
            box-shadow: 0 0 40px rgba(37,99,235,0.5);
            background: #0F1629;
        }
        .cid-headline {
            font-size: 1.1rem;
            color: #94A3B8;
            font-style: italic;
            margin: 8px 0;
        }
        .cid-slug {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(74,127,255,0.1);
            border: 1px solid rgba(74,127,255,0.2);
            border-radius: 999px;
            font-family: JetBrains Mono;
            font-size: 0.85rem;
            color: #4A7FFF;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cid-slug:hover {
            background: rgba(74,127,255,0.15);
            border-color: #4A7FFF;
        }
        
        .stat-bento {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin-top: 28px;
        }
        .stat-bento-item {
            background: rgba(6,11,24,0.4);
            border: 1px solid rgba(74,127,255,0.1);
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            transition: all 0.2s;
        }
        .stat-bento-item:hover {
            border-color: rgba(74,127,255,0.3);
            transform: translateY(-2px);
        }
        .stat-bento-value {
            font-family: Manrope;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #F1F5F9, #4A7FFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }
        .stat-bento-value.green {
            background: linear-gradient(135deg, #F1F5F9, #10B981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-bento-value.gold {
            background: linear-gradient(135deg, #F1F5F9, #F59E0B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-bento-value.cyan {
            background: linear-gradient(135deg, #F1F5F9, #22D3EE);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-bento-label {
            font-size: 0.7rem;
            color: #64748B;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-top: 4px;
        }
        
        /* TABS */
        .cid-tabs {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: rgba(74,127,255,0.05);
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid rgba(30,94,255,0.15);
            overflow-x: auto;
        }
        .cid-tab {
            flex: 1;
            min-width: 130px;
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: #94A3B8;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .cid-tab.active {
            background: #2563EB;
            color: white;
        }
        .cid-tab-panel { display: none; }
        .cid-tab-panel.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* SKILL EVIDENCE */
        .skill-card {
            background: rgba(15,22,41,0.6);
            border: 1px solid rgba(74,127,255,0.12);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        .skill-card:hover {
            border-color: rgba(74,127,255,0.3);
        }
        .skill-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .skill-level {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .level-learning { background: rgba(74,127,255,0.15); color: #4A7FFF; border: 1px solid rgba(74,127,255,0.3); }
        .level-practiced { background: rgba(245,185,66,0.15); color: #F59E0B; border: 1px solid rgba(245,185,66,0.3); }
        .level-verified { background: rgba(16,185,129,0.15); color: #10B981; border: 1px solid rgba(16,185,129,0.3); }
        
        .skill-sources {
            padding-top: 12px;
            border-top: 1px solid rgba(74,127,255,0.08);
        }
        .source-item {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 8px 0;
            font-size: 0.82rem;
            color: #94A3B8;
        }
        .source-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(74,127,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4A7FFF;
            flex-shrink: 0;
        }
        
        /* CERTIFICATE CARD */
        .cert-card {
            background: linear-gradient(135deg, rgba(15,22,41,0.9), rgba(10,16,32,0.95));
            border: 1px solid rgba(74,127,255,0.15);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        .cert-card.revoked {
            opacity: 0.6;
            border-color: rgba(239,68,68,0.3);
        }
        .cert-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #2563EB, #22D3EE);
        }
        .cert-card.revoked::before {
            background: #EF4444;
        }
        .cert-type-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .cert-type-course { background: rgba(74,127,255,0.15); color: #4A7FFF; }
        .cert-type-competition { background: rgba(124,58,237,0.15); color: #A855F7; }
        .cert-type-skill { background: rgba(34,211,238,0.15); color: #22D3EE; }
        
        .qr-container {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* PORTFOLIO */
        .portfolio-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: rgba(15,22,41,0.6);
            border: 1px solid rgba(74,127,255,0.12);
            border-radius: 12px;
            margin-bottom: 10px;
            text-decoration: none;
            color: #F1F5F9;
            transition: all 0.2s;
        }
        .portfolio-link:hover {
            border-color: rgba(74,127,255,0.4);
            transform: translateX(4px);
        }
        
        /* MODAL */
        .cid-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(6,11,24,0.92);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        .cid-modal.active { display: flex; }
        .cid-modal-box {
            background: #0F1629;
            border: 1px solid rgba(74,127,255,0.3);
            border-radius: 20px;
            padding: 32px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .cid-modal-box h3 {
            font-family: Manrope;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cid-modal-close {
            background: transparent;
            border: none;
            color: #94A3B8;
            cursor: pointer;
            font-size: 1.5rem;
            padding: 0 8px;
        }
        
        .field { margin-bottom: 16px; }
        .field label {
            display: block;
            font-size: 0.72rem;
            color: #94A3B8;
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 12px 14px;
            background: #060B18;
            border: 1px solid rgba(74,127,255,0.2);
            border-radius: 8px;
            color: #F1F5F9;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }
        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        
        .privacy-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: rgba(74,127,255,0.05);
            border: 1px solid rgba(74,127,255,0.15);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
        }
        .privacy-toggle:hover {
            background: rgba(74,127,255,0.08);
        }
        .privacy-toggle input {
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="girih-bg"></div>

<header class="header">
    <a href="/" class="logo">
        <div class="logo-mark">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

<div class="container">

<!-- EDIT MODAL -->

    </div>
</div>

<!-- ADD SKILL MODAL -->
<div id="skill-modal" class="cid-modal">
    <div class="cid-modal-box" style="max-width:480px;">
        <h3>
            <span>Ko'nikma qo'shish</span>

<script>
// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let cyberIdData = null;
let isOwner = false;
let currentUser = null;
let currentTab = 'overview';

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function esc(t) {
    if (t === null || t === undefined) return '';
    return String(t)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function formatDate(d) {
    if (!d) return '—';
    try {
        return new Date(d).toLocaleDateString('uz-UZ');
    } catch (e) { return '—'; }
}

function levelIcon(level) {
    const map = {
        learning: '📚',
        practiced: '⚡',
        verified: '✓'
    };
    return map[level] || '•';
}

function levelLabel(level) {
    const map = {
        learning: 'O\'rganmoqda',
        practiced: 'Amaliyot',
        verified: 'Tasdiqlangan'
    };
    return map[level] || level;
}

function certTypeLabel(type) {
    const map = {
        course: 'Kurs',
        competition: 'Musobaqa',
        skill: 'Ko\'nikma'
    };
    return map[type] || type;
}

function certTypeIcon(type) {
    const map = {
        course: '📚',
        competition: '🏆',
        skill: '⚡'
    };
    return map[type] || '📜';
}

// ══════════════════════════════════════════
// LOAD CYBER ID
// ══════════════════════════════════════════
async function loadCyberId() {
    try {
        // URL dan slug olish
        const pathParts = window.location.pathname.split('/');
        const slug = pathParts[pathParts.length - 1];
        
        const isOwnerView = !slug || slug === 'cyber-id';
        const endpoint = isOwnerView ? '/api/cyber-id/me' : `/api/cyber-id/${slug}`;

        const res = await fetch(endpoint, { 
            credentials: 'include',
            cache: 'no-store'
        });
        
        if (res.status === 401) {
            window.location.href = '/login';
            return;
        }

        const data = await res.json();

        if (!data.success) {
            if (data.hidden) {
                document.getElementById('cyber-id-content').innerHTML = `
                    <div class="card-glass" style="padding: 80px 40px; text-align: center; max-width: 500px; margin: 0 auto;">
                        <div style="font-size: 4rem; margin-bottom: 16px;">🔒</div>
                        <h2 style="font-family: Manrope; font-weight: 900; margin-bottom: 12px;">Bu profil maxfiy</h2>
                        <p style="color: #94A3B8; margin-bottom: 24px;">Foydalanuvchi profilini yashirgan</p>
                        <a href="/" class="btn btn-primary">Bosh sahifa</a>
                    </div>
                `;
                return;
            }
            throw new Error(data.message || 'Profil topilmadi');
        }

        cyberIdData = data.cyberId;
        isOwner = isOwnerView;
        renderCyberId();
    } catch (e) {
        console.error('Xato:', e);
        document.getElementById('cyber-id-content').innerHTML = `
            <div class="card-glass" style="padding: 60px; text-align: center;">
                <div style="font-size: 3rem; margin-bottom: 16px;">❌</div>
                <h2 style="color: #EF4444;">Xato</h2>
                <p style="color: #94A3B8;">${esc(e.message)}</p>
                <a href="/" class="btn btn-primary" style="margin-top: 20px;">Bosh sahifa</a>
            </div>
        `;
    }
}

// ══════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════
function renderCyberId() {
    const d = cyberIdData;
    const stats = d.stats || {};
    const skills = d.skills || [];
    const certificates = d.certificates || [];
    const portfolioLinks = d.portfolioLinks || [];
    const preferredRoles = d.preferredRoles || [];
    const location = [d.region, d.city].filter(Boolean).join(' · ') || 'Noma\'lum';

    document.getElementById('cyber-id-content').innerHTML = `
        <!-- HEADER -->
        <div class="cid-header fade-in-up">
            <div style="display: flex; gap: 32px; align-items: center; flex-wrap: wrap; position: relative; z-index: 1;">
                <img src="${d.avatar || '/assets/default-avatar.svg'}" 
                     class="cid-avatar" 
                     onerror="this.src='/assets/default-avatar.svg'">
                
                <div style="flex: 1; min-width: 250px;">
                    <h1 style="font-family: Manrope; font-size: 2.2rem; font-weight: 900; margin-bottom: 8px;">
                        ${esc(d.name)}
                    </h1>
                    ${d.headline ? `<div class="cid-headline">${esc(d.headline)}</div>` : ''}
                    
                    <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px;">
                        <span class="cid-slug" onclick="copyPublicUrl()" title="Nusxa olish">
                            🔗 @${esc(d.slug)}
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                        </span>
                        
                        ${location ? `
                            <span style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); border-radius: 999px; font-size: 0.82rem; color: #EF4444;">
                                📍 ${esc(location)}
                            </span>
                        ` : ''}
                        
                        ${d.openToOpportunities ? `
                            <span style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); border-radius: 999px; font-size: 0.82rem; color: #10B981; font-weight: 600;">
                                💼 Ish qidirmoqdaman
                            </span>
                        ` : ''}
                    </div>
                </div>
                
                ${isOwner ? `
                    <button class="btn btn-primary" onclick="openEditModal()" style="display: inline-flex; align-items: center; gap: 8px;">

// ══════════════════════════════════════════
// TABS
// ══════════════════════════════════════════
function switchTab(tab, el) {
    currentTab = tab;
    document.querySelectorAll('.cid-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.cid-tab-panel').forEach(p => p.classList.remove('active'));
    if (el) el.classList.add('active');
    document.getElementById(tab + '-panel').classList.add('active');
}

// ══════════════════════════════════════════
// COPY URL
// ══════════════════════════════════════════
function copyPublicUrl() {
    if (!cyberIdData) return;
    const url = `${window.location.origin}/cyber-id/${cyberIdData.slug}`;
    navigator.clipboard.writeText(url);
    alert('✅ Havola nusxalandi:\n' + url);
}

function copyCertUrl(certId) {
    const url = `${window.location.origin}/certificate-verify?id=${certId}`;
    navigator.clipboard.writeText(url);
    alert('✅ Sertifikat havolasi nusxalandi');
}

// ══════════════════════════════════════════
// EDIT MODAL
// ══════════════════════════════════════════
function openEditModal() {
    if (!cyberIdData) return;
    const d = cyberIdData;
    
    document.getElementById('edit-headline').value = d.headline || '';
    document.getElementById('edit-location').value = d.location || '';
    document.getElementById('edit-roles').value = (d.preferredRoles || []).join(', ');
    
    // Portfolio links
    const portfolioLines = (d.portfolioLinks || []).map(l => `${l.label}|${l.url}`).join('\n');
    document.getElementById('edit-portfolio').value = portfolioLines;
    
    // Visibility
    document.getElementById('vis-public').checked = d.visibility === 'public';
    document.getElementById('vis-private').checked = d.visibility === 'private';
    
    // Open to opportunities
    document.getElementById('edit-open').checked = d.openToOpportunities || false;
    
    document.getElementById('edit-message').textContent = '';
    document.getElementById('edit-modal').classList.add('active');
}

function closeEditModal() {
    document.getElementById('edit-modal').classList.remove('active');
}

async function saveCyberId() {
    const msg = document.getElementById('edit-message');
    
    const headline = document.getElementById('edit-headline').value.trim();
    const location = document.getElementById('edit-location').value.trim();
    const rolesStr = document.getElementById('edit-roles').value.trim();
    const portfolioStr = document.getElementById('edit-portfolio').value.trim();
    const visibility = document.querySelector('input[name="visibility"]:checked')?.value || 'public';
    const openToOpportunities = document.getElementById('edit-open').checked;

    // Parse roles
    const preferredRoles = rolesStr
        ? rolesStr.split(',').map(s => s.trim()).filter(Boolean).slice(0, 10)
        : [];

    // Parse portfolio
    const portfolioLinks = portfolioStr
        ? portfolioStr.split('\n')
            .map(line => {
                const parts = line.split('|');
                if (parts.length !== 2) return null;
                return {
                    label: parts[0].trim().slice(0, 50),
                    url: parts[1].trim().slice(0, 500)
                };
            })
            .filter(Boolean)
            .slice(0, 10)
        : [];

    msg.textContent = 'Saqlanmoqda...';
    msg.style.color = '#94A3B8';

    try {
        const res = await fetch('/api/cyber-id/me', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
                headline,
                location,
                preferredRoles,
                portfolioLinks,
                visibility,
                openToOpportunities
            })
        });
        const data = await res.json();

        if (data.success) {
            msg.textContent = '✅ ' + data.message;
            msg.style.color = '#10B981';
            setTimeout(() => {
                closeEditModal();
                loadCyberId();
            }, 800);
        } else {
            msg.textContent = '❌ ' + (data.message || 'Xato');
            msg.style.color = '#EF4444';
        }
    } catch (e) {
        msg.textContent = '❌ Ulanish xatosi';
        msg.style.color = '#EF4444';
    }
}

// ══════════════════════════════════════════
// ADD SKILL MODAL
// ══════════════════════════════════════════
function openSkillModal() {
    document.getElementById('skill-name').value = '';
    document.getElementById('skill-message').textContent = '';
    document.getElementById('skill-modal').classList.add('active');
    document.getElementById('skill-name').focus();
}

function closeSkillModal() {
    document.getElementById('skill-modal').classList.remove('active');
}

async function addSkill() {
    const name = document.getElementById('skill-name').value.trim();
    const msg = document.getElementById('skill-message');

    if (!name || name.length < 2) {
        msg.textContent = '❌ Ko\'nikma nomi kamida 2 belgi';
        msg.style.color = '#EF4444';
        return;
    }

    msg.textContent = 'Qo\'shilmoqda...';
    msg.style.color = '#94A3B8';

    try {
        const res = await fetch('/api/cyber-id/me/skills', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
                skillKey: name.toLowerCase().replace(/\s+/g, ''),
                skillLabel: name,
                evidenceType: 'assessment',
                sourceName: 'Self-declared'
            })
        });
        const data = await res.json();

        if (data.success) {
            msg.textContent = '✅ ' + data.message;
            msg.style.color = '#10B981';
            setTimeout(() => {
                closeSkillModal();
                loadCyberId();
            }, 800);
        } else {
            msg.textContent = '❌ ' + (data.message || 'Xato');
            msg.style.color = '#EF4444';
        }
    } catch (e) {
        msg.textContent = '❌ Ulanish xatosi';
        msg.style.color = '#EF4444';
    }
}

// ══════════════════════════════════════════
// MODAL CLOSE
// ══════════════════════════════════════════
document.getElementById('edit-modal').addEventListener('click', (e) => {
    if (e.target.id === 'edit-modal') closeEditModal();
});
document.getElementById('skill-modal').addEventListener('click', (e) => {
    if (e.target.id === 'skill-modal') closeSkillModal();
});

// ══════════════════════════════════════════
// AUTH CHECK
// ══════════════════════════════════════════
async function checkAuth() {
    try {
        const res = await fetch('/api/auth/me', { credentials: 'include', cache: 'no-store' });
        if (!res.ok) return null;
        const data = await res.json();
        if (!data.success || !data.user) return null;
        
        currentUser = data.user;
        const authLink = document.getElementById('auth-link');
        if (authLink) {
            authLink.innerHTML = `<img src="${currentUser.avatar || '/assets/default-avatar.svg'}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:1px solid #2563EB;" onerror="this.src='/assets/default-avatar.svg'">${esc(currentUser.username)}`;
        }
        return currentUser;
    } catch (e) {
        return null;
    }
}

// ══════════════════════════════════════════
// START
// ══════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
    await checkAuth();
    await loadCyberId();
});
