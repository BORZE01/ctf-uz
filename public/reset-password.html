<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parolni tiklash — CTF.UZ</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/preloader.css">
</head>
<body>

<div class="girih-bg"></div>

<div class="container-narrow">
    <div class="card-glass" style="max-width: 480px; margin: 80px auto; padding: 40px;">
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="font-size: 3rem; margin-bottom: 16px;">🔑</div>
            <h2 style="font-family: Manrope; margin-bottom: 8px;">Yangi parol</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Kuchli parol kiriting</p>
        </div>

        <form id="reset-form">
            <div class="input-group">
                <input type="password" id="new-password" placeholder=" " required minlength="8">
                <label>Yangi parol</label>
                <span class="hint">Kamida 8 belgi, 1 katta harf, 1 raqam</span>
            </div>
            <div class="input-group">
                <input type="password" id="confirm-password" placeholder=" " required>
                <label>Parolni tasdiqlash</label>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Saqlash</button>
        </form>

        <div id="reset-message" class="msg-box"></div>
    </div>
</div>

<script>
document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = new URLSearchParams(window.location.search).get('token');
    const password = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;
    const msg = document.getElementById('reset-message');

    if (!token) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Token topilmadi';
        return;
    }

    if (password !== confirm) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Parollar mos kelmadi';
        return;
    }

    try {
        const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password })
        });
        const data = await res.json();

        if (data.success) {
            msg.className = 'msg-box success';
            msg.innerText = '✅ ' + data.message;
            setTimeout(() => window.location.href = '/login', 1500);
        } else {
            msg.className = 'msg-box error';
            msg.innerText = '❌ ' + data.message;
        }
    } catch (err) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Ulanish xatosi';
    }
});
</script>
    <script src="/js/preloader.js"></script>
</body>
</html>
