<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil — CTF.UZ</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/modern-ui.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .profile-header {
            background: linear-gradient(135deg, rgba(37,99,235,0.1), rgba(124,58,237,0.1));
            border: 1px solid rgba(74,127,255,0.2);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
        }
        .avatar-big {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--uz-blue, #2563EB);
            box-shadow: 0 0 40px rgba(37,99,235,0.4);
            background: var(--surface, #0F1629);
        }
        .avatar-wrap { position: relative; }
        .avatar-edit {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--uz-blue, #2563EB);
            border: 3px solid #060B18;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .avatar-edit:hover { transform: scale(1.1); }

        .level-bar {
            height: 10px;
            background: rgba(74,127,255,0.1);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 8px;
        }
        .level-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #2563EB, #22D3EE);
            border-radius: 999px;
            transition: width 0.8s;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(6,11,24,0.9);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-overlay.active { display: flex; }

        .modal-box {
            background: #0F1629;
            border: 1px solid rgba(74,127,255,0.3);
            border-radius: 20px;
            padding: 32px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-box h3 {
            font-family: Manrope;
            font-weight: 800;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-secondary, #94A3B8);
            cursor: pointer;
            padding: 0 8px;
            display: flex;
            align-items: center;
        }
        .modal-close:hover { color: #EF4444; }

        .field { margin-bottom: 16px; }
        .field label {
            display: block;
            font-size: 0.72rem;
            color: #94A3B8;
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 12px 14px;
            background: #060B18;
            border: 1px solid rgba(74,127,255,0.2);
            border-radius: 8px;
            color: #F1F5F9;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }
        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .field textarea { min-height: 80px; resize: vertical; }

        .tab-bar {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: rgba(74,127,255,0.05);
            border-radius: 12px;
            margin-bottom: 32px;
            border: 1px solid rgba(30,94,255,0.15);
            overflow-x: auto;
        }
        .tab-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: #94A3B8;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .tab-btn.active {
            background: #2563EB;
            color: white;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .skill-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .skill-name {
            min-width: 140px;
            font-size: 0.8rem;
            color: #94A3B8;
            font-weight: 600;
        }
        .skill-progress {
            flex: 1;
            height: 8px;
            background: rgba(74,127,255,0.1);
            border-radius: 999px;
            overflow: hidden;
        }
        .skill-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2563EB, #22D3EE);
            border-radius: 999px;
            transition: width 0.6s;
        }
        .skill-value {
            min-width: 40px;
            text-align: right;
            font-family: JetBrains Mono;
            font-size: 0.8rem;
            color: #22D3EE;
            font-weight: 700;
        }

        .stat-mini {
            background: rgba(74,127,255,0.05);
            border: 1px solid rgba(74,127,255,0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-mini-value {
            font-family: Manrope;
            font-size: 1.8rem;
            font-weight: 900;
            color: #2563EB;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .stat-mini-label {
            color: #94A3B8;
            font-size: 0.72rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .card-glass {
            background: rgba(15,22,41,0.6);
            border: 1px solid rgba(74,127,255,0.12);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

<div class="girih-bg"></div>

<header class="header">
    <a href="/" class="logo">
        <div class="logo-mark">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
        </div>
        <div class="logo-text">CTF<span>.UZ</span></div>
    </a>
    <nav class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/arena">Arena</a>
        <a href="/battle">Battle</a>
        <a href="/leaderboard">Reyting</a>
        <a href="/career">Karyera</a>
        <a id="auth-link" href="/profile" class="active"></a>
    </nav>
</header>

<div class="container">
    <div id="profile-content">
        <div style="text-align: center; padding: 80px;">
            <div style="width: 40px; height: 40px; border: 3px solid rgba(37,99,235,0.2); border-top-color: #2563EB; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
            <p style="color: #94A3B8; margin-top: 16px;">Yuklanmoqda...</p>
        </div>
    </div>
</div>

<input type="file" id="avatar-input" accept="image/*" style="display: none;">

<!-- EDIT MODAL -->
<div id="edit-modal" class="modal-overlay">
    <div class="modal-box">
        <h3>
            <span style="display:flex;align-items:center;gap:10px;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A7FFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                Profilni tahrirlash
            </span>
            <button class="modal-close" onclick="closeEditModal()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18M6 6l12 12"/>
                </svg>
            </button>
        </h3>

        <form id="edit-form">
            <div class="field">
                <label>To'liq ism</label>
                <input type="text" id="edit-name" required maxlength="50">
            </div>
            <div class="field">
                <label>Telefon raqam</label>
                <input type="text" id="edit-phone" required placeholder="+998 XX XXX XX XX">
            </div>
            <div class="field">
                <label>Bio</label>
                <textarea id="edit-bio" placeholder="O'zingiz haqingizda qisqacha..." maxlength="500"></textarea>
            </div>
            <div class="field">
                <label>Viloyat</label>
                <select id="edit-region">
                    <option value="">Viloyatni tanlang</option>
                </select>
            </div>
            <div class="field">
                <label>Shahar / Tuman</label>
                <input type="text" id="edit-city" placeholder="Toshkent">
            </div>
            <div class="field">
                <label>GitHub username</label>
                <input type="text" id="edit-github" placeholder="username">
            </div>
            <div class="field">
                <label>Telegram username</label>
                <input type="text" id="edit-telegram" placeholder="username (@ belgisisiz)">
            </div>
            <div class="field">
                <label>Website</label>
                <input type="url" id="edit-website" placeholder="https://...">
            </div>

            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-primary" style="flex: 1; justify-content: center;">
                    Saqlash
                </button>
                <button type="button" class="btn btn-secondary" style="flex: 1; justify-content: center;" onclick="closeEditModal()">
                    Bekor qilish
                </button>
            </div>
        </form>

        <div id="edit-message" style="margin-top: 12px; font-size: 0.85rem;"></div>
    </div>
</div>

<script>
// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let userData = null;
let regionsList = [];

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function esc(t) {
    if (t === null || t === undefined) return '';
    return String(t)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function svgIcon(name, size = 20, color = 'currentColor') {
    const icons = {
        user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
        bolt: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
        target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2" fill="currentColor"/>',
        trophy: '<path d="M6 9H4a2 2 0 0 1-2-2V5h4M18 9h2a2 2 0 0 0 2-2V5h-4M6 5h12v6a6 6 0 0 1-12 0V5zM12 17v3M8 21h8M9 21v-2a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',
        fire: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
        location: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
        edit: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',
        share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98M15.41 6.51l-6.82 3.98"/>',
        globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/>',
        chart: '<path d="M3 3v18h18M7 16v-5M12 16V8M17 16v-9"/>',
        'chart-up': '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
        lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
        check: '<polyline points="20 6 9 17 4 12"/>',
        clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
        shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
        activity: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
        logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
        camera: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>'
    };
    const path = icons[name] || icons.user;
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:${size}px;height:${size}px;vertical-align:middle;">${path}</svg>`;
}

// ══════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════
async function checkAuth() {
    try {
        const res = await fetch('/api/auth/me', { 
            credentials: 'include', 
            cache: 'no-store' 
        });
        
        if (!res.ok) {
            console.log('Auth xato:', res.status);
            window.location.href = '/login';
            return null;
        }
        
        const data = await res.json();
        
        if (!data.success || !data.user) {
            console.log('Auth muvaffaqiyatsiz');
            window.location.href = '/login';
            return null;
        }
        
        // Navbar yangilash
        const authLink = document.getElementById('auth-link');
        if (authLink) {
            authLink.innerHTML = `<img src="${data.user.avatar || '/assets/default-avatar.svg'}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:1px solid #2563EB;" onerror="this.src='/assets/default-avatar.svg'">${esc(data.user.username)}`;
        }
        
        return data.user;
    } catch (e) {
        console.error('Auth xatosi:', e);
        window.location.href = '/login';
        return null;
    }
}

// ══════════════════════════════════════════
// LOAD PROFILE
// ══════════════════════════════════════════
async function loadProfile() {
    try {
        const res = await fetch('/api/users/profile', { 
            credentials: 'include',
            cache: 'no-store'
        });
        
        if (!res.ok) {
            console.error('Profile API xato:', res.status);
            showError('Profil yuklanmadi (status: ' + res.status + ')');
            return;
        }
        
        const data = await res.json();
        
        if (!data.success) {
            console.error('Profile xato:', data.message);
            showError(data.message || 'Profil yuklanmadi');
            return;
        }
        
        userData = data.user;
        renderProfile();
    } catch (e) {
        console.error('Profile xatosi:', e);
        showError('Ulanish xatosi');
    }
}

function showError(message) {
    document.getElementById('profile-content').innerHTML = `
        <div class="card-glass" style="padding: 60px; text-align: center;">
            <div style="font-size: 3rem; margin-bottom: 16px;">❌</div>
            <h2 style="color: #EF4444; margin-bottom: 12px;">${esc(message)}</h2>
            <p style="color: #94A3B8; margin-bottom: 20px;">Iltimos, qayta login qilib ko'ring</p>
            <a href="/login" class="btn btn-primary">Login sahifasiga</a>
        </div>
    `;
}

// ══════════════════════════════════════════
// RENDER PROFILE
// ══════════════════════════════════════════
function renderProfile() {
    const u = userData;
    const location = [u.region, u.city].filter(Boolean).join(' · ') || 'Noma\'lum';
    const solvedCount = (u.solvedChallenges || []).length;
    const skills = u.skills || {};

    document.getElementById('profile-content').innerHTML = `
        <div class="profile-header fade-in-up">
            <div style="display: flex; gap: 32px; align-items: center; flex-wrap: wrap;">
                <div class="avatar-wrap">
                    <img src="${u.avatar || '/assets/default-avatar.svg'}" 
                         class="avatar-big" id="avatar-preview" 
                         onerror="this.src='/assets/default-avatar.svg'">
                    <div class="avatar-edit" onclick="document.getElementById('avatar-input').click()" title="Avatar yuklash">
                        ${svgIcon('camera', 18, 'white')}
                    </div>
                </div>

                <div style="flex: 1; min-width: 250px;">
                    <h1 style="font-family: Manrope; font-size: 2rem; font-weight: 900; margin-bottom: 8px;">
                        ${esc(u.name)}
                    </h1>
                    <div style="color: #94A3B8; margin-bottom: 8px; font-family: JetBrains Mono;">
                        @${esc(u.username)}
                    </div>
                    <div style="color: #94A3B8; font-size: 0.9rem; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;">
                        ${svgIcon('location', 14, '#EF4444')}
                        ${esc(location)}
                    </div>
                    ${u.bio ? `<p style="color: #94A3B8; font-size: 0.9rem; max-width: 500px; margin-bottom: 12px;">${esc(u.bio)}</p>` : ''}
                    
                    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                        <span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; background: rgba(37,99,235,0.15); border: 1px solid rgba(37,99,235,0.3); border-radius: 999px; font-size: 0.75rem; font-weight: 700; color: #4A7FFF;">
                            ${svgIcon('bolt', 14, '#4A7FFF')}
                            Level ${u.level || u.cyberLevel || 1}
                        </span>
                        ${u.verified ? `<span style="display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); border-radius: 999px; font-size: 0.75rem; font-weight: 700; color: #10B981;">${svgIcon('check', 12, '#10B981')} VERIFIED</span>` : ''}
                    </div>
                </div>
            </div>

            <div style="margin-top: 32px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                    <span style="font-family: Manrope; font-weight: 800; color: #4A7FFF; display: inline-flex; align-items: center; gap: 6px;">
                        ${svgIcon('bolt', 16, '#4A7FFF')}
                        Level ${u.level || u.cyberLevel || 1}
                    </span>
                    <span style="font-family: JetBrains Mono; font-size: 0.85rem; color: #94A3B8;">
                        ${(u.xp || 0).toLocaleString()} / ${(u.nextLevelXP || 10000).toLocaleString()} XP
                    </span>
                </div>
                <div class="level-bar">
                    <div class="level-bar-fill" style="width: ${u.levelProgress || 0}%;"></div>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-top: 32px;">
                <div class="stat-mini">
                    <div class="stat-mini-value">#${u.globalRank || '—'}</div>
                    <div class="stat-mini-label">Global rank</div>
                </div>
                <div class="stat-mini">
                    <div class="stat-mini-value">${u.score || 0}</div>
                    <div class="stat-mini-label">Score</div>
                </div>
                <div class="stat-mini">
                    <div class="stat-mini-value">${solvedCount}</div>
                    <div class="stat-mini-label">Yechilgan</div>
                </div>
                <div class="stat-mini">
                    <div class="stat-mini-value">
                        ${u.streak || 0}
                        ${svgIcon('fire', 20, '#F59E0B')}
                    </div>
                    <div class="stat-mini-label">Streak</div>
                </div>
                <div class="stat-mini">
                    <div class="stat-mini-value">${u.battleRating || 1000}</div>
                    <div class="stat-mini-label">Battle</div>
                </div>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="openEditModal()" style="display: inline-flex; align-items: center; gap: 8px;">
                    ${svgIcon('edit', 16, 'white')}
                    Profilni tahrirlash
                </button>
                <button class="btn btn-secondary" onclick="shareProfile()" style="display: inline-flex; align-items: center; gap: 8px;">
                    ${svgIcon('share', 16)}
                    Ulashish
                </button>
                <a href="/u/${esc(u.username)}" target="_blank" class="btn btn-secondary" style="display: inline-flex; align-items: center; gap: 8px;">
                    ${svgIcon('globe', 16)}
                    Public ko'rinish
                </a>
            </div>
        </div>

        <div class="tab-bar">
            <button class="tab-btn active" onclick="showTab('overview', this)">
                ${svgIcon('chart', 16)}
                Overview
            </button>
            <button class="tab-btn" onclick="showTab('skills', this)">
                ${svgIcon('target', 16)}
                Ko'nikmalar
            </button>
            <button class="tab-btn" onclick="showTab('activity', this)">
                ${svgIcon('activity', 16)}
                Faoliyat
            </button>
            <button class="tab-btn" onclick="showTab('security', this)">
                ${svgIcon('shield', 16)}
                Xavfsizlik
            </button>
        </div>

        <div id="overview-tab" class="tab-content active">
            <div class="card-glass" style="padding: 24px;">
                <h3 style="font-family: Manrope; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                    ${svgIcon('user', 20, '#4A7FFF')}
                    Profil ma'lumotlari
                </h3>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                    <div>

// ══════════════════════════════════════════
// TAB
// ══════════════════════════════════════════
function showTab(tab, el) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tab + '-tab').classList.add('active');
    if (el) el.classList.add('active');
}

// ══════════════════════════════════════════
// EDIT MODAL
// ══════════════════════════════════════════
async function openEditModal() {
    const u = userData;

    if (regionsList.length === 0) {
        try {
            const res = await fetch('/api/locations/regions');
            const data = await res.json();
            if (data.success) regionsList = data.regions || [];
        } catch (e) {}
    }

    const regionSelect = document.getElementById('edit-region');
    regionSelect.innerHTML = '<option value="">Viloyatni tanlang</option>';
    regionsList.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.name;
        opt.textContent = r.name;
        if (r.name === u.region) opt.selected = true;
        regionSelect.appendChild(opt);
    });

    document.getElementById('edit-name').value = u.name || '';
    document.getElementById('edit-phone').value = u.phone ? '+' + u.phone : '+998 ';
    document.getElementById('edit-bio').value = u.bio || '';
    document.getElementById('edit-city').value = u.city || '';
    document.getElementById('edit-github').value = u.github || '';
    document.getElementById('edit-telegram').value = u.telegram || '';
    document.getElementById('edit-website').value = u.website || '';

    document.getElementById('edit-modal').classList.add('active');
}

function closeEditModal() {
    document.getElementById('edit-modal').classList.remove('active');
    document.getElementById('edit-message').textContent = '';
}

// ══════════════════════════════════════════
// SAVE
// ══════════════════════════════════════════
document.getElementById('edit-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const msg = document.getElementById('edit-message');
    const btn = e.target.querySelector('button[type="submit"]');

    const name = document.getElementById('edit-name').value.trim();
    const phone = document.getElementById('edit-phone').value.replace(/[^0-9]/g, '');
    const bio = document.getElementById('edit-bio').value.trim();
    const region = document.getElementById('edit-region').value;
    const city = document.getElementById('edit-city').value.trim();
    const github = document.getElementById('edit-github').value.trim();
    const telegram = document.getElementById('edit-telegram').value.trim();
    const website = document.getElementById('edit-website').value.trim();

    if (!name || name.length < 2) {
        msg.style.color = '#EF4444';
        msg.textContent = 'Ism kamida 2 belgi';
        return;
    }

    if (phone.length !== 12) {
        msg.style.color = '#EF4444';
        msg.textContent = 'Telefon raqam to\'liq emas';
        return;
    }

    btn.disabled = true;
    msg.style.color = '#94A3B8';
    msg.textContent = 'Saqlanmoqda...';

    try {
        const res = await fetch('/api/users/profile', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
                name, phone, bio, region, city, github, telegram, website
            })
        });

        const data = await res.json();

        if (data.success) {
            msg.style.color = '#10B981';
            msg.textContent = '✅ ' + data.message;
            setTimeout(() => {
                closeEditModal();
                loadProfile();
            }, 1000);
        } else {
            msg.style.color = '#EF4444';
            msg.textContent = '❌ ' + data.message;
        }
    } catch (err) {
        msg.style.color = '#EF4444';
        msg.textContent = '❌ Ulanish xatosi';
    } finally {
        btn.disabled = false;
    }
});

// ══════════════════════════════════════════
// PHONE FORMAT
// ══════════════════════════════════════════
document.getElementById('edit-phone').addEventListener('input', function() {
    let digits = this.value.replace(/[^0-9]/g, '');
    if (!digits.startsWith('998')) digits = '998' + digits.replace(/^998/, '');
    digits = digits.substring(0, 12);
    let formatted = '+998';
    if (digits.length > 3) formatted += ' ' + digits.substring(3, 5);
    if (digits.length > 5) formatted += ' ' + digits.substring(5, 8);
    if (digits.length > 8) formatted += ' ' + digits.substring(8, 10);
    if (digits.length > 10) formatted += ' ' + digits.substring(10, 12);
    this.value = formatted;
});

// ══════════════════════════════════════════
// AVATAR
// ══════════════════════════════════════════
async function uploadAvatar(e) {
    const file = e.target.files[0];
    if (!file) return;

    if (file.size > 5 * 1024 * 1024) {
        alert('Rasm 5MB dan kichik bo\'lishi kerak');
        return;
    }

    const fd = new FormData();
    fd.append('avatar', file);

    try {
        const res = await fetch('/api/users/avatar', {
            method: 'POST',
            body: fd,
            credentials: 'include'
        });
        const data = await res.json();

        if (data.success) {
            document.getElementById('avatar-preview').src = data.avatar + '?t=' + Date.now();
        } else {
            alert(data.message);
        }
    } catch (err) {
        alert('Xatolik');
    }
}

// ══════════════════════════════════════════
// SHARE
// ══════════════════════════════════════════
function shareProfile() {
    const url = `${window.location.origin}/u/${userData.username}`;
    navigator.clipboard.writeText(url);
    alert('Profil havolasi nusxalandi!');
}

// ══════════════════════════════════════════
// LOGOUT
// ══════════════════════════════════════════
async function logout() {
    if (!confirm('Chiqishni tasdiqlaysizmi?')) return;
    try {
        await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
    } catch (e) {}
    window.location.href = '/';
}

});
