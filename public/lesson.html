<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dars — CTF.UZ Academy</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/modern-ui.css">
    <style>
        body { background: #070B19; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 30px auto; }
        .back-btn { color: #4A7FFF; text-decoration: none; font-weight: bold; }
        .card { background: rgba(15,22,41,0.85); border: 1px solid rgba(74,127,255,0.2); border-radius: 16px; padding: 24px; margin-top: 20px; }
        .lesson-title { font-size: 1.8rem; margin: 10px 0; color: #fff; }
        .lesson-content { line-height: 1.7; color: #CBD5E1; margin-top: 15px; }
        .q-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 16px; margin-top: 15px; }
        input[type="text"] { width: 100%; max-width: 400px; padding: 10px; border-radius: 8px; border: 1px solid #3B82F6; background: #0f1629; color: #fff; margin-top: 8px; box-sizing: border-box; }
        .btn { background: #2563EB; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #1D4ED8; }
        .msg { margin-top: 8px; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <a href="/learn" class="back-btn">← Barcha darslarga qaytish</a>
    
    <div class="card">
        <h1 id="title" class="lesson-title">Yuklanmoqda...</h1>
        <div id="meta" style="color: #94A3B8; font-size: 0.9rem;"></div>
        <div id="content" class="lesson-content"></div>
    </div>

    <div class="card">
        <h3>Amaliy savollar va topshiriqlar</h3>
        <div id="questions">Yuklanmoqda...</div>
    </div>
</div>

<script>
async function init() {
    const parts = window.location.pathname.split('/').filter(Boolean);
    const slug = parts[parts.length - 1];

    try {
        const res = await fetch('/api/learn/academy/lesson-detail/' + slug).then(r => r.json());
        if (!res.success || !res.lesson) {
            document.getElementById('title').innerText = "Dars topilmadi";
            document.getElementById('content').innerText = "Ushbu dars mavjud emas yoki nomi o'zgargan.";
            document.getElementById('questions').innerText = "";
            return;
        }

        const l = res.lesson;
        document.getElementById('title').innerText = l.title;
        document.getElementById('meta').innerText = 'Davomiyligi: ' + (l.duration || 15) + ' min | Mukofot: ' + (l.xpReward || 50) + ' XP';
        document.getElementById('content').innerHTML = l.content;

        const qBox = document.getElementById('questions');
        if (res.questions && res.questions.length > 0) {
            let html = '';
            res.questions.forEach((q, i) => {
                html += '<div class="q-card">' +
                    '<div><strong>' + (i + 1) + '. ' + q.prompt + '</strong></div>' +
                    '<input type="text" id="ans_' + q._id + '" placeholder="Javobni yozing..."><br>' +
                    '<button class="btn" onclick="sendAns(\'' + q._id + '\')">Javob berish</button>' +
                    '<div id="msg_' + q._id + '" class="msg"></div>' +
                '</div>';
            });
            qBox.innerHTML = html;
        } else {
            qBox.innerHTML = '<p style="color:#94A3B8;">Ushbu dars uchun hozircha test savollari yo\'q.</p>';
        }
    } catch(err) {
        document.getElementById('title').innerText = "Yuklashda xatolik yuz berdi";
    }
}

async function sendAns(qid) {
    const val = document.getElementById('ans_' + qid).value.trim();
    const msg = document.getElementById('msg_' + qid);
    if (!val) {
        msg.style.color = '#EF4444';
        msg.innerText = "Javob kiriting!";
        return;
    }

    try {
        let csrf = '';
        try {
            const c = await fetch('/api/csrf-token').then(r => r.json());
            csrf = c.csrfToken || '';
        } catch(e) {}

        const res = await fetch('/api/learn/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrf },
            body: JSON.stringify({ questionId: qid, userAnswer: val })
        }).then(r => r.json());

        msg.style.color = res.success ? '#10B981' : '#EF4444';
        msg.innerText = res.message || (res.success ? "To'g'ri!" : "Noto'g'ri!");
    } catch(e) {
        msg.style.color = '#EF4444';
        msg.innerText = "Server xatosi!";
    }
}

window.onload = init;
</script>
</body>
</html>
