<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dars — CTF.UZ Academy</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/modern-ui.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/preloader.css">
    <style>
        .progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: #10B981; width: 0%; z-index: 9999; transition: width 0.1s; }
        
        .lesson-container { max-width: 1200px; margin: 0 auto; padding: 32px 20px; display: grid; grid-template-columns: 280px 1fr; gap: 32px; align-items: start; position: relative; z-index: 2; }
        @media(max-width: 900px) { .lesson-container { grid-template-columns: 1fr; } .lesson-sidebar { display: none; } }
        
        /* Arena & Learn card dizayni bilan 100% bir xil qilingan sidebar va main-content */
        .lesson-sidebar { background: rgba(15,22,41,0.8); border: 1px solid rgba(74,127,255,0.15); border-radius: 16px; padding: 24px; position: sticky; top: 100px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .lesson-sidebar h3 { font-family: 'Manrope', sans-serif; font-size: 1.2rem; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; margin-top: 0; margin-bottom: 16px; }
        .toc-list { list-style: none; padding: 0; margin: 0; }
        .toc-list li { margin-bottom: 12px; line-height: 1.5; }
        .toc-list a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-family: 'Inter', sans-serif; transition: 0.2s; display: block; }
        .toc-list a:hover { color: var(--uz-blue); transform: translateX(4px); }
        .toc-sub { padding-left: 16px; border-left: 1px solid rgba(74,127,255,0.2); }
        
        .lesson-main { background: rgba(15,22,41,0.8); border: 1px solid rgba(74,127,255,0.15); border-radius: 16px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        .breadcrumb { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 0.9rem; text-decoration: none; margin-bottom: 32px; transition: 0.2s; font-family: 'Inter', sans-serif; }
        .breadcrumb:hover { color: var(--uz-blue); }
        
        .lesson-title { font-family: 'Manrope', sans-serif; font-size: 2.2rem; font-weight: 800; color: #fff; margin: 0 0 16px 0; line-height: 1.2; }
        .lesson-meta { display: flex; gap: 24px; font-size: 0.9rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; padding-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 32px; }
        
        .content-body { color: #CBD5E1; font-size: 1.05rem; line-height: 1.8; font-family: 'Inter', sans-serif; }
        .content-body h2 { font-family: 'Manrope', sans-serif; color: #fff; font-size: 1.7rem; margin: 40px 0 20px 0; padding-bottom: 10px; border-bottom: 1px dashed rgba(255,255,255,0.1); }
        .content-body h3 { font-family: 'Manrope', sans-serif; color: #fff; font-size: 1.3rem; margin: 32px 0 16px 0; }
        .content-body p { margin-bottom: 20px; }
        .content-body ul, .content-body ol { margin-bottom: 20px; padding-left: 24px; }
        .content-body li { margin-bottom: 8px; }
        
        /* Code block */
        .code-wrapper { position: relative; margin: 24px 0; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; }
        .copy-btn { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: 'Inter', sans-serif; }
        .copy-btn:hover { background: var(--uz-blue); }
        .code-wrapper pre { margin: 0; padding: 24px; overflow-x: auto; color: #E2E8F0; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; line-height: 1.5; }
        
        /* Questions */
        .q-section { margin-top: 48px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 40px; }
        .q-section-title { font-family: 'Manrope', sans-serif; font-size: 1.5rem; color: #fff; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
        
        .q-card { background: rgba(74, 127, 255, 0.03); border: 1px solid rgba(74, 127, 255, 0.15); padding: 24px; border-radius: 16px; margin-bottom: 24px; }
        .q-card p { font-size: 1.05rem; color: #fff; margin: 0 0 16px 0; font-weight: 500; font-family: 'Inter', sans-serif;}
        
        .q-input { width: 100%; max-width: 500px; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; margin-bottom: 16px; outline: none; transition: 0.2s; }
        .q-input:focus { border-color: var(--uz-blue); box-shadow: 0 0 0 3px rgba(74, 127, 255, 0.2); }
        
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 48px; padding-top: 32px; border-top: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <div class="girih-bg"></div>
    <div class="progress-bar" id="scrollProgress"></div>
    
    <header class="header">
        <a href="/" class="logo">
            <div class="logo-mark">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
            </div>
            <div class="logo-text">CTF<span>.UZ</span></div>
        </a>
        
    <nav class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/arena">Arena</a>
        <a href="/learn">O'rganish</a>
        <a href="/battle">Battle</a>
        <a href="/leaderboard">Reyting</a>
        <a href="/career">Karyera</a>
        <a id="auth-link" href="/profile"></a>
    </nav>

    </header>

    <div class="lesson-container">
        <aside class="lesson-sidebar fade-in-up">
            <h3>Mundarija</h3>
            <ul class="toc-list" id="tocList"></ul>
        </aside>
        
        <main class="lesson-main fade-in-up">
            <a href="/learn" class="breadcrumb">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Barcha darslarga qaytish
            </a>
            
            <h1 class="lesson-title" id="title">Yuklanmoqda...</h1>
            <div class="lesson-meta" id="meta"></div>
            
            <div class="content-body" id="content">
                <!-- Content -->
            </div>
            
            <div class="q-section">
                <h3 class="q-section-title">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="color:var(--uz-blue);"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Amaliy Topshiriqlar
                </h3>
                <div id="questions"></div>
            </div>

            <div class="nav-buttons">
                <a href="#" id="btnPrev" class="btn btn-secondary" style="visibility:hidden; display:inline-flex; align-items:center; gap:8px;">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Oldingi
                </a>
                <a href="#" id="btnNext" class="btn btn-primary" style="visibility:hidden; display:inline-flex; align-items:center; gap:8px;">
                    Keyingi
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </a>
            </div>
        </main>
    </div>

    <script>
        window.addEventListener('load', async () => {
            try {
                const authRes = await fetch('/api/auth/me', { credentials: 'include', cache: 'no-store' });
                if (authRes.ok) {
                    const authData = await authRes.json();
                    if (authData.success && authData.user) {
                        const authLink = document.getElementById('auth-link');
                        if (authLink) authLink.innerHTML = `<img src="${authData.user.avatar || '/assets/default-avatar.svg'}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:1px solid #2563EB;" onerror="this.src='/assets/default-avatar.svg'">${authData.user.username}`;
                    }
                }
            } catch (e) {}
        });

        async function init() {
            const path = window.location.pathname.replace(/^\/learn\/?/, '');
            const parts = path.split('/').filter(Boolean);
            
            try {
                const res = await fetch('/api/learn/academy/lesson-detail/' + parts.join('/')).then(r => r.json());
                if (!res.success) {
                    document.getElementById('title').innerText = 'Dars topilmadi';
                    document.getElementById('content').innerHTML = '<p>Ushbu dars mavjud emas.</p>';
                    return;
                }
                
                const l = res.lesson;
                document.getElementById('title').innerText = l.title;
                document.getElementById('meta').innerHTML = `
                    <span style="display:flex; align-items:center; gap:6px;"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> ${l.duration || 15} daqiqa</span> 
                    <span style="color:#F59E0B; display:flex; align-items:center; gap:6px;"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg> ${l.xpReward || 50} XP</span>
                `;
                document.getElementById('content').innerHTML = l.content || '<p>Dars matni yo\'q.</p>';

                const contentDiv = document.getElementById('content');
                const headings = contentDiv.querySelectorAll('h2, h3');
                const toc = document.getElementById('tocList');
                if (headings.length === 0) {
                    toc.innerHTML = '<li><span style="color:#94A3B8">Qo\'shimcha sarlavhalar yo\'q</span></li>';
                }
                headings.forEach((h, i) => {
                    const id = 'section-' + i;
                    h.id = id;
                    toc.innerHTML += `<li class="${h.tagName === 'H3' ? 'toc-sub' : ''}"><a href="#${id}">${h.innerText}</a></li>`;
                });

                contentDiv.querySelectorAll('pre').forEach(pre => {
                    const wrap = document.createElement('div');
                    wrap.className = 'code-wrapper';
                    const btn = document.createElement('button');
                    btn.className = 'copy-btn';
                    btn.innerText = 'Nusxalash';
                    btn.onclick = () => {
                        navigator.clipboard.writeText(pre.innerText);
                        btn.innerText = '✅ Nusxalandi!';
                        btn.style.background = '#10B981';
                        setTimeout(() => {
                            btn.innerText = 'Nusxalash';
                            btn.style.background = '';
                        }, 2000);
                    };
                    pre.parentNode.insertBefore(wrap, pre);
                    wrap.appendChild(btn);
                    wrap.appendChild(pre);
                });

                const qBox = document.getElementById('questions');
                if (res.questions && res.questions.length > 0) {
                    qBox.innerHTML = res.questions.map((q, i) => `
                        <div class="q-card">
                            <p>${i+1}. ${q.prompt}</p>
                            <input type="text" id="ans_${q._id}" class="q-input" placeholder="Javobni kiriting...">
                            <br><button class="btn btn-primary" onclick="sendAns('${q._id}')">Javobni tekshirish</button>
                            <div id="msg_${q._id}" style="margin-top:15px; font-weight:bold; font-family:'Inter', sans-serif;"></div>
                        </div>
                    `).join('');
                } else {
                    qBox.innerHTML = "<p style='color:#94A3B8'>Amaliy mashqlar yuklanmagan.</p>";
                }

                loadNavigation(l.moduleSlug, l.slug);

            } catch(e) { document.getElementById('title').innerText = 'Xatolik yuz berdi'; }
        }

        async function loadNavigation(modSlug, lesSlug) {
            try {
                const res = await fetch('/api/learn/modules').then(r=>r.json());
                const mod = res.data.find(m => m.slug === modSlug);
                if(mod) {
                    const idx = mod.lessons.findIndex(l => l.slug === lesSlug);
                    if(idx > 0) {
                        const prev = mod.lessons[idx-1];
                        const b = document.getElementById('btnPrev');
                        b.href = '/learn/' + modSlug + '/' + prev.slug;
                        b.style.visibility = 'visible';
                    }
                    if(idx < mod.lessons.length - 1) {
                        const nxt = mod.lessons[idx+1];
                        const b = document.getElementById('btnNext');
                        b.href = '/learn/' + modSlug + '/' + nxt.slug;
                        b.style.visibility = 'visible';
                    }
                }
            } catch(e){}
        }

        async function sendAns(qid) {
            const val = document.getElementById('ans_'+qid).value.trim();
            const msg = document.getElementById('msg_'+qid);
            if(!val) {
                msg.innerHTML = "<span style='color:#EF4444'>Iltimos, avval javobni kiriting!</span>";
                return;
            }
            msg.innerHTML = "<span style='color:#94A3B8'>Tekshirilmoqda...</span>";
            let csrf = '';
            try { csrf = (await fetch('/api/csrf-token').then(r=>r.json())).csrfToken || ''; } catch(e){}
            const res = await fetch('/api/learn/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrf },
                body: JSON.stringify({ questionId: qid, userAnswer: val })
            }).then(r=>r.json());
            msg.innerHTML = `<span style="color:${res.success ? '#10B981' : '#EF4444'}">${res.message}</span>`;
        }

        window.onscroll = () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('scrollProgress').style.width = scrolled + '%';
        };

        window.onload = init;
    </script>
    <script src="/js/preloader.js"></script>
</body>
</html>
