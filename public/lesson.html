<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dars — CTF.UZ</title>
    <!-- ARENA CSS FAYLLARI -->
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/modern-ui.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="girih-bg"></div>

<header class="header">
    <a href="/" class="logo">
        <div class="logo-mark">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
        </div>
        <div class="logo-text">CTF<span>.UZ</span></div>
    </a>
    <nav class="nav">
        <a href="/dashboard" data-page="dashboard">Dashboard</a>
        <a href="/arena" data-page="arena">Arena</a>
        <a href="/learn" data-page="learn" class="active">O'rganish</a>
        <a href="/battle" data-page="battle">Battle</a>
        <a href="/leaderboard" data-page="leaderboard">Reyting</a>
        <a href="/career" data-page="career">Karyera</a>
        <a id="auth-link" href="/profile" data-page="profile"></a>
    </nav>
</header>

<div class="container">
    <!-- Orqaga qaytish -->
    <a href="/learn" class="btn btn-secondary btn-sm" style="display: inline-flex; align-items: center; gap: 8px; margin-bottom: 24px;">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Modullarga qaytish
    </a>

    <!-- Dars haqida ma'lumot qismi -->
    <div style="background: rgba(19, 28, 49, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 32px; margin-bottom: 24px; backdrop-filter: blur(10px);">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px;">
            <div>
                <h1 id="l-title" style="margin-bottom: 16px; font-size: 1.8rem; font-weight: 700; color: #fff;">Yuklanmoqda...</h1>
                <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                    <span class="badge badge-web">Cybersecurity</span>
                    <span class="badge badge-easy">Boshlang'ich</span>
                    <span style="color: var(--text-muted); font-size: 0.9rem; display: flex; align-items: center; gap: 6px;">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        15 min
                    </span>
                </div>
            </div>
            <div style="font-family: Manrope; font-size: 1.5rem; font-weight: 800; color: #10B981; display: flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.1); padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(16, 185, 129, 0.2);">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                <span id="l-xp">0</span> XP
            </div>
        </div>
    </div>

    <!-- Dars Matni va Test bo'limi 2 ta ustunda -->
    <div style="display: grid; grid-template-columns: 1fr 400px; gap: 24px; align-items: start;" id="lesson-grid">
        <!-- MATN BO'LIMI -->
        <div style="background: rgba(19, 28, 49, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 32px; font-size: 1.05rem; line-height: 1.8; color: #E2E8F0; backdrop-filter: blur(10px); min-height: 400px;" id="l-body">
            Dars matni yuklanmoqda...
        </div>

        <!-- AMALIYOT BO'LIMI -->
        <div style="position: sticky; top: 100px;">
            <div style="background: rgba(19, 28, 49, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 24px; backdrop-filter: blur(10px);">
                <h3 style="margin-bottom: 20px; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; color: #fff;">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                    Amaliyot va Test
                </h3>
                <div id="questions-container">
                    <div style="color: var(--text-muted); text-align: center; padding: 20px;">Savollar yuklanmoqda...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Mobil ekranlarda 2ta ustunni 1 ustunga o'tkazish uchun sodda moslashuv
    if(window.innerWidth < 900) document.getElementById('lesson-grid').style.gridTemplateColumns = '1fr';

    const slug = window.location.pathname.split('/').pop();
    
    // Navbar Profilini yuklash
    fetch('/api/auth/me', { credentials: 'include' }).then(r=>r.json()).then(d => {
        if(d.success && d.user) {
            document.getElementById('auth-link').innerHTML = `<img src="${d.user.avatar || '/assets/default-avatar.svg'}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:1px solid #2563EB;">${d.user.username}`;
        }
    }).catch(e=>{});

    // Dars va Savollarni yuklash
    fetch('/api/learn/lesson/' + slug).then(r => r.json()).then(data => {
        if(!data.success) return document.getElementById('l-title').innerText = "Dars topilmadi";
        
        document.getElementById('l-title').innerText = data.lesson.title;
        document.getElementById('l-body').innerHTML = data.lesson.content || 'Kontent kiritilmagan';
        document.getElementById('l-xp').innerText = data.lesson.xpReward || 50;
        
        const qCont = document.getElementById('questions-container');
        if(!data.questions || data.questions.length === 0) {
            qCont.innerHTML = "<div style='color: var(--text-muted); text-align: center; font-size: 0.9rem;'>Ushbu dars uchun savol yo'q.</div>";
        } else {
            qCont.innerHTML = '';
            
        data.questions.forEach((q, i) => {
            const solvedHtml = q.isSolved ? 
                '<div style="margin-top: 12px; font-size: 0.85rem; font-weight: 600; padding: 10px; border-radius: 8px; background: rgba(16, 185, 129, 0.1); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.2);"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"><polyline points="20 6 9 17 4 12"/></svg> Siz bu savolni to\'g\'ri topgansiz!</div>' : '';
            
            const inputDisabled = q.isSolved ? 'disabled value="To\'g\'ri topilgan"' : '';
            const btnDisplay = q.isSolved ? 'display: none;' : '';

            qCont.innerHTML += `
            <div style="margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px dashed rgba(255,255,255,0.1);">
                <label style="display: block; margin-bottom: 12px; font-size: 0.95rem; font-weight: 600; color: #fff; line-height: 1.5;">${i+1}. ${q.prompt}</label>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <input type="text" id="ans-${q._id}" placeholder="Javobni kiriting..." ${inputDisabled} style="width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px 16px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; outline: none; transition: 0.3s;" onfocus="this.style.borderColor='#3B82F6'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
                    <button class="btn btn-primary" onclick="checkAnswer('${q._id}')" style="width: 100%; justify-content: center; ${btnDisplay}">Javobni Yuborish</button>
                </div>
                <div id="feed-${q._id}" style="margin-top: 12px; font-size: 0.85rem; font-weight: 600; display: none; padding: 10px; border-radius: 8px;"></div>
                ${solvedHtml}
            </div>`;
        });
        
        }
    });

    // Javobni Serverga Yuborish
    async function checkAnswer(qId) {
        const input = document.getElementById('ans-'+qId);
        const feed = document.getElementById('feed-'+qId);
        const btn = input.nextElementSibling;
        if(!input.value) return;

        btn.innerText = "Tekshirilmoqda...";
        
        try {
            let csrfToken = '';
            try {
                const cRes = await fetch('/api/csrf-token');
                const cData = await cRes.json();
                csrfToken = cData.csrfToken || cData.token || '';
            } catch(e) {}

            const res = await fetch('/api/learn/submit', {
                method: 'POST', 
                headers: {
                    'Content-Type': 'application/json',
                    'x-csrf-token': csrfToken
                },
                body: JSON.stringify({questionId: qId, userAnswer: input.value})
            });
            const result = await res.json();

            feed.style.display = "block";
            btn.innerText = "Javobni Yuborish";

            if(result.success) {
                feed.innerHTML = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"><polyline points="20 6 9 17 4 12"/></svg> ${result.message}`;
                feed.style.background = "rgba(16, 185, 129, 0.1)";
                feed.style.color = "#10B981";
                feed.style.border = "1px solid rgba(16, 185, 129, 0.2)";
                input.disabled = true;
                btn.style.display = "none";
                
                // Tepada XP sonini vizual yangilash
                if(result.pointsAdded) {
                    const curXp = parseInt(document.getElementById('l-xp').innerText);
                    document.getElementById('l-xp').innerText = curXp + result.pointsAdded;
                }
            } else {
                feed.innerHTML = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> ${result.message}`;
                feed.style.background = "rgba(239, 68, 68, 0.1)";
                feed.style.color = "#EF4444";
                feed.style.border = "1px solid rgba(239, 68, 68, 0.2)";
            }
        } catch(e) {
            btn.innerText = "Xato. Qaytadan yuboring";
        }
    }
</script>
</body>
</html>
