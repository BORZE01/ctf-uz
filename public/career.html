<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karyera — CTF.UZ</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/modern-ui.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Konteynerni markazlashtirish */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Grid tizimi (Har qanday ekranga moslashuvchan) */
        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }

        .job-card {
            background: rgba(15,22,41,0.8);
            border: 1px solid rgba(74,127,255,0.12);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .job-card:hover {
            border-color: rgba(74,127,255,0.35);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.3);
        }
        .match-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            font-family: JetBrains Mono;
            font-weight: 800;
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 999px;
        }
        .match-high { background: rgba(16,185,129,0.15); color: #10B981; border: 1px solid rgba(16,185,129,0.3); }
        .match-mid { background: rgba(245,185,66,0.15); color: #F59E0B; border: 1px solid rgba(245,185,66,0.3); }
        .match-low { background: rgba(239,68,68,0.15); color: #EF4444; border: 1px solid rgba(239,68,68,0.3); }
        .job-skill {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(74,127,255,0.1);
            border: 1px solid rgba(74,127,255,0.2);
            border-radius: 6px;
            font-size: 0.72rem;
            color: #4A7FFF;
            margin-right: 6px;
            margin-bottom: 8px;
        }
        .job-skill.matched {
            background: rgba(16,185,129,0.1);
            border-color: rgba(16,185,129,0.3);
            color: #10B981;
        }
        .job-skill.missing {
            background: rgba(239,68,68,0.1);
            border-color: rgba(239,68,68,0.3);
            color: #EF4444;
        }
    </style>
</head>
<body>

<div class="girih-bg"></div>

<header class="header">
    <a href="/" class="logo">
        <div class="logo-mark">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
        </div>
        <div class="logo-text">CTF<span>.UZ</span></div>
    </a>
    <nav class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/arena">Arena</a>
        <a href="/learn" >O'rganish</a>
        <a href="/battle">Battle</a>
        <a href="/leaderboard">Reyting</a>
        <a href="/career" class="active">Karyera</a>
        <a id="auth-link" href="/profile"></a>
    </nav>
</header>

<div class="container">
    <div style="text-align: center; padding: 40px 20px 40px;">
        <h1 style="font-family: Manrope; font-size: 2.5rem; font-weight: 900; margin-bottom: 12px;">
            Sizga mos <span style="background: linear-gradient(135deg, #2563EB, #22D3EE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">vakansiyalar</span>
        </h1>
        <p style="color: #94A3B8; max-width: 600px; margin: 0 auto; font-size: 1rem;">
            Cyber ID ko'nikmalaringizga asoslanib, sizga eng mos ish o'rinlarini ko'rsatamiz.
        </p>
    </div>

    <!-- Recommendations Grid -->
    <div id="recommendations" class="jobs-grid">
        <div class="skeleton-card" style="min-height: 240px;">
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-text long"></div>
            <div class="skeleton skeleton-text medium"></div>
        </div>
        <div class="skeleton-card" style="min-height: 240px;">
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-text long"></div>
            <div class="skeleton skeleton-text medium"></div>
        </div>
    </div>

    <div>
        <h2 style="font-family: Manrope; font-size: 1.3rem; font-weight: 800; margin-bottom: 20px;">Barcha vakansiyalar</h2>
        <!-- All Jobs Grid -->
        <div id="all-jobs" class="jobs-grid">
            <div class="skeleton-card" style="min-height: 240px;"></div>
            <div class="skeleton-card" style="min-height: 240px;"></div>
        </div>
    </div>
</div>

<script>
// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function esc(t) {
    if (t === null || t === undefined) return '';
    return String(t)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function matchClass(score) {
    if (score >= 75) return 'match-high';
    if (score >= 50) return 'match-mid';
    return 'match-low';
}

function formatSalary(job) {
    if (!job.salaryMin && !job.salaryMax) return 'Kelishiladi';
    if (job.salaryMin && job.salaryMax) {
        return `${job.salaryMin.toLocaleString()} - ${job.salaryMax.toLocaleString()} ${job.salaryCurrency || 'UZS'}`;
    }
    if (job.salaryMin) return `${job.salaryMin.toLocaleString()}+ ${job.salaryCurrency || 'UZS'}`;
    return `-${job.salaryMax.toLocaleString()} ${job.salaryCurrency || 'UZS'}`;
}

// ══════════════════════════════════════════
// RENDER JOB CARD
// ══════════════════════════════════════════
function renderJobCard(job, match = null) {
    const employer = job.employerId || {};
    const score = match?.score || 0;
    
    return `
        <div class="job-card" onclick="viewJob('${job._id}')">
            ${match ? `<span class="match-badge ${matchClass(score)}">${score}%</span>` : ''}
            
            <div style="display: flex; gap: 12px; margin-bottom: 16px;">
                <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #2563EB, #7C3AED); display: flex; align-items: center; justify-content: center; font-family: Manrope; font-weight: 900; color: white; font-size: 1.3rem; flex-shrink: 0;">
                    ${esc((employer.name?.[0] || '?').toUpperCase())}
                </div>
                <div style="flex: 1; padding-right: ${match ? '60px' : '0'};">
                    <h3 style="font-family: Manrope; font-weight: 700; font-size: 1rem; margin-bottom: 4px; line-height: 1.3;">${esc(job.title)}</h3>
                    <div style="color: #94A3B8; font-size: 0.85rem;">${esc(employer.name || 'Kompaniya')}</div>
                </div>
            </div>
            
            <div style="display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;">
                <span style="padding: 3px 10px; background: rgba(37,99,235,0.15); color: #4A7FFF; border-radius: 999px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase;">${esc(job.level || 'junior')}</span>
                <span style="padding: 3px 10px; background: rgba(74,127,255,0.1); color: #94A3B8; border-radius: 999px; font-size: 0.7rem;">${esc(job.jobType || 'full-time')}</span>
                ${job.remote ? '<span style="padding: 3px 10px; background: rgba(34,211,238,0.15); color: #22D3EE; border-radius: 999px; font-size: 0.7rem;">🌐 Remote</span>' : ''}
                ${job.location ? `<span style="padding: 3px 10px; background: rgba(74,127,255,0.1); color: #94A3B8; border-radius: 999px; font-size: 0.7rem;">📍 ${esc(job.location)}</span>` : ''}
            </div>
            
            ${job.requiredSkills && job.requiredSkills.length ? `
                <div style="margin-bottom: 16px; flex-grow: 1;">
                    ${job.requiredSkills.slice(0, 4).map(s => {
                        const isMatched = match?.requiredMatched?.some(m => m.toLowerCase() === s.toLowerCase());
                        const cls = match ? (isMatched ? 'matched' : 'missing') : '';
                        return `<span class="job-skill ${cls}">${esc(s)}</span>`;
                    }).join('')}
                    ${job.requiredSkills.length > 4 ? `<span class="job-skill">+${job.requiredSkills.length - 4}</span>` : ''}
                </div>
            ` : '<div style="flex-grow: 1;"></div>'}
            
            <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid rgba(74,127,255,0.1); margin-top: auto;">
                <span style="color: #F59E0B; font-weight: 700; font-family: JetBrains Mono; font-size: 0.85rem;">${formatSalary(job)}</span>
                <span style="color: #4A7FFF; font-weight: 600; font-size: 0.8rem;">Batafsil →</span>
            </div>
        </div>
    `;
}

// ══════════════════════════════════════════
// LOAD RECOMMENDATIONS
// ══════════════════════════════════════════
async function loadRecommendations() {
    try {
        const res = await fetch('/api/career/recommendations', { credentials: 'include' });
        const data = await res.json();
        
        const container = document.getElementById('recommendations');
        
        if (!data.success || !data.recommendations || data.recommendations.length === 0) {
            container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748B;">Sizning ko\'nikmalaringizga mos keladigan vakansiyalar hozircha yo\'q.</div>';
            return;
        }
        
        container.innerHTML = data.recommendations.slice(0, 6).map(job => 
            renderJobCard(job, job.match)
        ).join('');
    } catch (e) {
        console.error('Recommendations xatosi:', e);
    }
}

// ══════════════════════════════════════════
// LOAD ALL JOBS
// ══════════════════════════════════════════
async function loadAllJobs() {
    try {
        const res = await fetch('/api/career/jobs?limit=50', { credentials: 'include' });
        const data = await res.json();
        
        const container = document.getElementById('all-jobs');
        
        if (!data.success || !data.jobs || data.jobs.length === 0) {
            container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748B;">Hozircha vakansiyalar mavjud emas.</div>';
            return;
        }
        
        container.innerHTML = data.jobs.map(job => renderJobCard(job)).join('');
    } catch (e) {
        console.error('All jobs xatosi:', e);
    }
}

// ══════════════════════════════════════════
// VIEW JOB
// ══════════════════════════════════════════
function viewJob(id) {
    window.location.href = `/job?id=${id}`;
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
    try {
        const authRes = await fetch('/api/auth/me', { credentials: 'include' });
        if (authRes.ok) {
            const data = await authRes.json();
            if (data.success && data.user) {
                const authLink = document.getElementById('auth-link');
                if (authLink) {
                    authLink.innerHTML = `<img src="${data.user.avatar || '/assets/default-avatar.svg'}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:1px solid #2563EB;" onerror="this.src='/assets/default-avatar.svg'">${esc(data.user.username)}`;
                }
            }
        }
    } catch (e) {}
    
    loadRecommendations();
    loadAllJobs();
});
</script>
<script src="/js/career-employer-banner.js"></script>
</body>
</html>
