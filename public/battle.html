<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle — CTF.UZ</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="girih-bg"></div>

<header class="header">
    <a href="/" class="logo"><div class="logo-mark">CU</div><div class="logo-text">CTF<span>.UZ</span></div></a>
    <nav class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/arena">Arena</a>
        <a href="/battle" class="active">Battle</a>
        <a href="/leaderboard">Reyting</a>
        <a href="/career">Karyera</a>
        <a id="auth-link" class="nav-cta"></a>
    </nav>
</header>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 16px;">
        <div>
            <h1 style="margin-bottom: 8px;">1v1 Cyber Battle</h1>
            <p style="color: var(--text-secondary);">Real-time duel. Raqib bilan bellashing.</p>
        </div>
        <button class="btn btn-primary btn-lg" onclick="openBattleModal()">⚔️ Battle boshlash</button>
    </div>

    <h2 class="section-title" style="font-size: 1.5rem;">Aktiv battles</h2>
    <div id="active-battles" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-bottom: 48px;">
        <div class="spinner"></div>
    </div>

    <h2 class="section-title" style="font-size: 1.5rem;">Battle Rating TOP</h2>
    <div id="battle-leaderboard" class="leaderboard">
        <div class="spinner"></div>
    </div>
</div>

<!-- MODAL -->
<div id="battle-modal" class="modal">
    <div class="modal-content">
        <h2 style="margin-bottom: 24px;">⚔️ Yangi Battle</h2>
        <div class="input-group">
            <input type="text" id="opponent-username" placeholder=" " required>
            <label>Raqib username</label>
            <span class="hint">@ belgisisiz yozing</span>
        </div>
        <div class="input-group">
            <input type="number" id="challenge-count" placeholder=" " value="3" min="1" max="5">
            <label>Challenge soni</label>
        </div>
        <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button class="btn btn-primary" style="flex: 1;" onclick="createBattle()">Boshlash</button>
            <button class="btn btn-secondary" style="flex: 1;" onclick="closeModal()">Bekor qilish</button>
        </div>
        <div id="battle-message" class="msg-box"></div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/guard.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>
<script>
window.addEventListener('load', async () => {
    const user = await requireAuth();
    if (!user) return;
    await checkSession();
    loadBattles();
    loadBattleLeaderboard();
});

async function loadBattles() {
    const res = await API.get('/battles');
    if (!res.success) return;

    const list = document.getElementById('active-battles');
    if (res.battles.length === 0) {
        list.innerHTML = `
            <div class="card-glass" style="grid-column: 1 / -1; text-align: center; padding: 60px;">
                <div style="font-size: 3rem; margin-bottom: 16px;">⚔️</div>
                <p style="color: var(--text-secondary);">Hozircha aktiv battle yo'q. Birinchi bo'lib boshlang!</p>
            </div>
        `;
        return;
    }

    list.innerHTML = res.battles.map(b => `
        <div class="card-glass fade-in-up">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <span class="badge" style="background: rgba(245,185,66,0.15); color: var(--gold); border: 1px solid rgba(245,185,66,0.3);">
                    ${b.status === 'active' ? '🔴 LIVE' : '⏳ KUTILMOQDA'}
                </span>
                <span class="mono" style="color: var(--text-muted); font-size: 0.75rem;">#${b.id}</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="text-align: center; flex: 1;">
                    <div class="leaderboard-avatar" style="margin: 0 auto 8px;">A</div>
                    <div style="font-size: 0.75rem; color: var(--text-secondary);">Player A</div>
                </div>
                <div style="font-family: Manrope; font-weight: 900; color: var(--gold); font-size: 1.5rem;">VS</div>
                <div style="text-align: center; flex: 1;">
                    <div class="leaderboard-avatar" style="margin: 0 auto 8px; background: linear-gradient(135deg, var(--gold), var(--gold-dark));">B</div>
                    <div style="font-size: 0.75rem; color: var(--text-secondary);">Player B</div>
                </div>
            </div>
        </div>
    `).join('');
}

async function loadBattleLeaderboard() {
    const res = await API.get('/users/all');
    if (!res.success) return;

    const sorted = res.users.sort((a, b) => b.score - a.score).slice(0, 10);
    document.getElementById('battle-leaderboard').innerHTML = sorted.map((u, i) => `
        <div class="leaderboard-row ${i < 3 ? 'top-' + (i + 1) : ''}">
            <div class="leaderboard-rank">${i + 1}</div>
            <div class="leaderboard-user">
                <div class="leaderboard-avatar">${u.username[0].toUpperCase()}</div>
                <div>
                    <div class="leaderboard-name">${u.name}</div>
                    <div class="leaderboard-username">@${u.username}</div>
                </div>
            </div>
            <div class="leaderboard-score">${u.score}</div>
            <div class="leaderboard-solved">${u.solved} solves</div>
        </div>
    `).join('');
}

function openBattleModal() {
    document.getElementById('battle-modal').classList.add('active');
}

function closeModal() {
    document.getElementById('battle-modal').classList.remove('active');
}

async function createBattle() {
    const opponent = document.getElementById('opponent-username').value.trim();
    const count = parseInt(document.getElementById('challenge-count').value);
    const msg = document.getElementById('battle-message');

    if (!opponent) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Raqib username kiriting';
        return;
    }

    const challengeIds = [1, 2, 3].slice(0, count);
    const res = await API.post('/battles/create', { opponentUsername: opponent, challengeIds });

    if (res.success) {
        msg.className = 'msg-box success';
        msg.innerText = '✅ Battle yaratildi!';
        setTimeout(() => {
            closeModal();
            loadBattles();
        }, 1500);
    } else {
        msg.className = 'msg-box error';
        msg.innerText = '❌ ' + res.message;
    }
}
</script>
</body>
</html>
