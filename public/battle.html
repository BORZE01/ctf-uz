<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle — CTF.UZ</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/modern-ui.css">
    <link rel="stylesheet" href="/css/preloader.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .battle-card {
            background: linear-gradient(135deg, rgba(15, 22, 41, 0.9) 0%, rgba(10, 16, 32, 0.95) 100%);
            border: 1px solid rgba(74, 127, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s;
        }
        .battle-card:hover {
            border-color: rgba(74, 127, 255, 0.35);
            transform: translateY(-3px);
        }
        .battle-vs {
            font-family: Manrope;
            font-weight: 900;
            font-size: 1.6rem;
            color: #F59E0B;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
            padding: 0 12px;
        }
        .battle-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563EB, #22D3EE);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: white;
            font-size: 1.2rem;
            overflow: hidden;
            border: 2px solid rgba(74, 127, 255, 0.3);
        }
        .battle-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .battle-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-pending { background: rgba(245, 185, 66, 0.15); color: #F59E0B; border: 1px solid rgba(245, 185, 66, 0.3); }
        .status-active { background: rgba(239, 68, 68, 0.15); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .status-completed { background: rgba(16, 185, 129, 0.15); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-rejected, .status-expired { background: rgba(100, 116, 139, 0.15); color: #94A3B8; border: 1px solid rgba(100, 116, 139, 0.3); }
        
        .challenge-battle-item {
            background: rgba(15, 22, 41, 0.6);
            border: 1px solid rgba(74, 127, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        .challenge-battle-item.solved-me {
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(16, 185, 129, 0.05);
        }
        .challenge-battle-item.solved-opponent {
            border-color: rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.05);
        }
        
        .modal-battle {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(6, 11, 24, 0.92);
            backdrop-filter: blur(8px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-battle.active { display: flex; }
        .modal-battle-box {
            background: #0F1629;
            border: 1px solid rgba(74, 127, 255, 0.35);
            border-radius: 20px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .tab-btn-battle {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid rgba(74, 127, 255, 0.15);
            border-radius: 10px;
            color: #94A3B8;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn-battle.active {
            background: #2563EB;
            color: white;
            border-color: #2563EB;
        }
        .timer-badge {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 4px 12px;
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 999px;
        }
    </style>
</head>
<body>

<div class="girih-bg"></div>

<header class="header">
    <a href="/" class="logo">
        <div class="logo-mark">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
        </div>
        <div class="logo-text">CTF<span>.UZ</span></div>
    </a>
    <nav class="nav">
        <a href="/dashboard" data-page="dashboard">Dashboard</a>
        <a href="/arena" data-page="arena">Arena</a>
        <a href="/battle" data-page="battle" class="active">Battle</a>
        <a href="/leaderboard" data-page="leaderboard">Reyting</a>
        <a href="/career" data-page="career">Karyera</a>
        <a id="auth-link" href="/profile" data-page="profile"></a>
    </nav>
</header>

<div class="container">
    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: end; margin-bottom: 32px; flex-wrap: wrap; gap: 16px;">
        <div>
            <h1 style="margin-bottom: 8px; display: flex; align-items: center; gap: 12px;">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:36px;height:36px;color:#EF4444;">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M21 19l-3 3M3 21l18-18"/>
                </svg>
                1v1 Battle
            </h1>
            <p style="color: var(--text-secondary);">Real-time duel. Raqib bilan bellashing.</p>
        </div>
        <button class="btn btn-primary btn-lg" onclick="openCreateModal()">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                <path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M21 19l-3 3"/>
            </svg>
            Battle boshlash
        </button>
    </div>

    <!-- Tabs -->
    <div style="display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap;">
        <button class="tab-btn-battle active" data-tab="active" onclick="switchTab('active', this)">Aktiv</button>
        <button class="tab-btn-battle" data-tab="pending" onclick="switchTab('pending', this)">Kutilmoqda</button>
        <button class="tab-btn-battle" data-tab="history" onclick="switchTab('history', this)">Tarix</button>
        <button class="tab-btn-battle" data-tab="leaderboard" onclick="switchTab('leaderboard', this)">TOP</button>
    </div>

    <!-- Tab content -->
    <div id="tab-content">
        <div class="spinner"></div>
    </div>
</div>

<!-- CREATE MODAL -->
<div id="createModal" class="modal-battle">
    <div class="modal-battle-box">
        <h3 style="font-family: Manrope; font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;color:#EF4444;">
                <path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M21 19l-3 3"/>
            </svg>
            Yangi Battle
        </h3>
        
        <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 0.72rem; color: var(--text2); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Raqib username</label>
            <input type="text" id="opponentUsername" placeholder="username" 
                style="width: 100%; padding: 12px 14px; background: var(--bg2, #0A1020); border: 1px solid rgba(74, 127, 255, 0.2); border-radius: 10px; color: var(--text); font-family: inherit; font-size: 0.9rem; outline: none;">
            <div style="font-size: 0.72rem; color: var(--text3); margin-top: 6px;">@ belgisisiz yozing</div>
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 0.72rem; color: var(--text2); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Challenge soni</label>
            <select id="challengeCount" style="width: 100%; padding: 12px 14px; background: var(--bg2, #0A1020); border: 1px solid rgba(74, 127, 255, 0.2); border-radius: 10px; color: var(--text); font-family: inherit; font-size: 0.9rem; outline: none;">
                <option value="3">3 ta challenge</option>
                <option value="5">5 ta challenge</option>
                <option value="1">1 ta challenge</option>
            </select>
        </div>

        <div id="createMessage" style="margin-bottom: 16px; font-size: 0.85rem;"></div>

        <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" style="flex: 1; justify-content: center;" onclick="createBattle()">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
                Boshlash
            </button>
            <button class="btn btn-secondary" style="flex: 1; justify-content: center;" onclick="closeCreateModal()">
                Bekor qilish
            </button>
        </div>
    </div>
</div>

<script src="/js/preloader.js"></script>
<script>
let currentUser = null;
let currentTab = 'active';
let refreshInterval = null;

// ══════════════════════════════════════════
// ESCAPE
// ══════════════════════════════════════════
function esc(t) {
    if (t === null || t === undefined) return '';
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ══════════════════════════════════════════
// TAB SWITCH
// ══════════════════════════════════════════
function switchTab(tab, el) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn-battle').forEach(b => b.classList.remove('active'));
    if (el) el.classList.add('active');
    loadTab();
}

// ══════════════════════════════════════════
// LOAD TAB
// ══════════════════════════════════════════
async function loadTab() {
    const container = document.getElementById('tab-content');
    container.innerHTML = '<div class="spinner"></div>';

    if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }

    try {
        if (currentTab === 'active' || currentTab === 'pending') {
            await loadBattles();
            refreshInterval = setInterval(loadBattles, 10000); // har 10 sek
        } else if (currentTab === 'history') {
            await loadHistory();
        } else if (currentTab === 'leaderboard') {
            await loadLeaderboard();
        }
    } catch (e) {
        console.error(e);
        container.innerHTML = `<div style="text-align:center;padding:60px;color:var(--text3);">Xato: ${esc(e.message)}</div>`;
    }
}

// ══════════════════════════════════════════
// LOAD BATTLES
// ══════════════════════════════════════════
async function loadBattles() {
    const container = document.getElementById('tab-content');
    const res = await fetch('/api/battles', { credentials: 'include' });
    const data = await res.json();

    if (!data.success) {
        container.innerHTML = `<div style="text-align:center;padding:60px;color:var(--text3);">Battle yuklanmadi</div>`;
        return;
    }

    let battles = data.battles || [];
    if (currentTab === 'pending') {
        battles = battles.filter(b => b.status === 'pending');
    } else if (currentTab === 'active') {
        battles = battles.filter(b => b.status === 'active');
    }

    if (battles.length === 0) {
        container.innerHTML = `
            <div style="text-align:center;padding:80px 20px;color:var(--text3);">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:64px;height:64px;opacity:0.2;margin-bottom:16px;">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M21 19l-3 3"/>
                </svg>
                <p style="font-size: 0.95rem; margin-bottom: 16px;">
                    ${currentTab === 'active' ? 'Aktiv battle yo\'q' : 'Kutilayotgan battle yo\'q'}
                </p>
                <button class="btn btn-primary" onclick="openCreateModal()">Battle boshlash</button>
            </div>
        `;
        return;
    }

    container.innerHTML = `
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px;">
            ${battles.map(b => renderBattleCard(b)).join('')}
        </div>
    `;
}

function renderBattleCard(b) {
    const isPending = b.status === 'pending';
    const isActive = b.status === 'active';
    const isMyInvite = isPending && b.isChallenger;
    const isTheirInvite = isPending && !b.isChallenger;

    const statusText = {
        pending: 'KUTILMOQDA',
        active: 'LIVE',
        completed: 'TUGADI',
        rejected: 'RAD ETILDI',
        expired: 'MUDDATI TUGADI'
    }[b.status] || b.status;

    const me = b.isChallenger ? b.challenger : b.opponent;
    const them = b.isChallenger ? b.opponent : b.challenger;

    return `
        <div class="battle-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <span class="battle-status status-${b.status}">
                    ${isActive ? '<span style="width:8px;height:8px;background:#EF4444;border-radius:50%;animation:pulse 1.5s infinite;"></span>' : ''}
                    ${statusText}
                </span>
                ${isActive ? `<span class="timer-badge" data-expires="${b.expiresAt}">--:--</span>` : ''}
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
                <div style="text-align: center; flex: 1;">
                    <div class="battle-avatar" style="margin: 0 auto 8px;">
                        ${me.avatar ? `<img src="${esc(me.avatar)}" onerror="this.style.display='none';this.parentElement.innerText='${esc((me.username[0] || '?').toUpperCase())}'">` : esc((me.username[0] || '?').toUpperCase())}
                    </div>
                    <div style="font-size: 0.8rem; font-weight: 700;">@${esc(me.username)}</div>
                    <div style="font-size: 0.7rem; color: var(--text3);">SIZ</div>
                    <div style="font-family: JetBrains Mono; font-weight: 900; font-size: 1.2rem; color: #10B981; margin-top: 8px;">${b.scores.mine}</div>
                </div>

                <div class="battle-vs">VS</div>

                <div style="text-align: center; flex: 1;">
                    <div class="battle-avatar" style="margin: 0 auto 8px; background: linear-gradient(135deg, #F59E0B, #EF4444);">
                        ${them.avatar ? `<img src="${esc(them.avatar)}" onerror="this.style.display='none';this.parentElement.innerText='${esc((them.username[0] || '?').toUpperCase())}'">` : esc((them.username[0] || '?').toUpperCase())}
                    </div>
                    <div style="font-size: 0.8rem; font-weight: 700;">@${esc(them.username)}</div>
                    <div style="font-size: 0.7rem; color: var(--text3);">RAQIB</div>
                    <div style="font-family: JetBrains Mono; font-weight: 900; font-size: 1.2rem; color: #EF4444; margin-top: 8px;">${b.scores.opponent}</div>
                </div>
            </div>

            ${isTheirInvite ? `
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-primary" style="flex: 1; justify-content: center;" onclick="acceptBattle('${b.id}')">
                        Qabul qilish
                    </button>
                    <button class="btn btn-secondary" style="flex: 1; justify-content: center;" onclick="rejectBattle('${b.id}')">
                        Rad etish
                    </button>
                </div>
            ` : isActive ? `
                <a href="/battle/${b.id}" class="btn btn-primary" style="width: 100%; justify-content: center;">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                    Davom ettirish
                </a>
            ` : isMyInvite ? `
                <div style="text-align: center; color: var(--text3); font-size: 0.8rem; padding: 12px; background: rgba(245, 185, 66, 0.05); border-radius: 10px;">
                    ⏳ Raqib javobini kutmoqda...
                </div>
            ` : ''}
        </div>
    `;
}

// ══════════════════════════════════════════
// LOAD HISTORY
// ══════════════════════════════════════════
async function loadHistory() {
    const container = document.getElementById('tab-content');
    const res = await fetch('/api/battles/history', { credentials: 'include' });
    const data = await res.json();

    if (!data.success || !data.battles || data.battles.length === 0) {
        container.innerHTML = `
            <div style="text-align:center;padding:80px 20px;color:var(--text3);">
                <p>Tarix bo'sh</p>
            </div>
        `;
        return;
    }

    container.innerHTML = `
        <div style="display: grid; gap: 12px;">
            ${data.battles.map(b => {
                const me = b.isChallenger ? b.challenger : b.opponent;
                const them = b.isChallenger ? b.opponent : b.challenger;
                const won = b.winner === me.id;
                const draw = !b.winner;
                const ratingDelta = b.ratingChange ? b.ratingChange.after - b.ratingChange.before : 0;
                
                return `
                    <div class="battle-card" style="padding: 16px 20px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <div class="battle-avatar" style="width: 40px; height: 40px; font-size: 0.9rem;">
                                    ${them.avatar ? `<img src="${esc(them.avatar)}">` : esc((them.username[0] || '?').toUpperCase())}
                                </div>
                                <div>
                                    <div style="font-weight: 700; font-size: 0.9rem;">vs @${esc(them.username)}</div>
                                    <div style="font-size: 0.72rem; color: var(--text3);">
                                        ${new Date(b.completedAt).toLocaleString('uz-UZ')}
                                    </div>
                                </div>
                            </div>
                            
                            <div style="display: flex; align-items: center; gap: 16px;">
                                <div style="text-align: center;">
                                    <div style="font-family: JetBrains Mono; font-weight: 900; font-size: 1.2rem; color: ${won ? '#10B981' : draw ? '#F59E0B' : '#EF4444'};">
                                        ${b.scores.mine} : ${b.scores.opponent}
                                    </div>
                                    <div style="font-size: 0.72rem; color: var(--text3);">
                                        ${won ? '🏆 G\'alaba' : draw ? '🤝 Durang' : '❌ Mag\'lubiyat'}
                                    </div>
                                </div>
                                
                                <div style="text-align: right;">
                                    <div style="font-family: JetBrains Mono; font-weight: 700; font-size: 0.9rem; color: ${ratingDelta >= 0 ? '#10B981' : '#EF4444'};">
                                        ${ratingDelta >= 0 ? '+' : ''}${ratingDelta}
                                    </div>
                                    <div style="font-size: 0.7rem; color: var(--text3);">ELO</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('')}
        </div>
    `;
}

// ══════════════════════════════════════════
// LOAD LEADERBOARD
// ══════════════════════════════════════════
async function loadLeaderboard() {
    const container = document.getElementById('tab-content');
    const res = await fetch('/api/battles/leaderboard', { credentials: 'include' });
    const data = await res.json();

    if (!data.success || !data.users || data.users.length === 0) {
        container.innerHTML = `<div style="text-align:center;padding:80px;color:var(--text3);">Hozircha bo'sh</div>`;
        return;
    }

    container.innerHTML = `
        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Foydalanuvchi</th>
                        <th>ELO Rating</th>
                        <th>W</th>
                        <th>L</th>
                    </tr>
                </thead>
                <tbody>
                    ${data.users.map((u, i) => `
                        <tr>
                            <td style="font-family: JetBrains Mono; font-weight: 700;">${i + 1}</td>
                            <td>
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <div class="battle-avatar" style="width: 32px; height: 32px; font-size: 0.8rem;">
                                        ${u.avatar ? `<img src="${esc(u.avatar)}">` : esc((u.username[0] || '?').toUpperCase())}
                                    </div>
                                    <div>
                                        <div style="font-weight: 700; font-size: 0.85rem;">${esc(u.name || u.username)}</div>
                                        <div style="font-size: 0.72rem; color: var(--text3);">@${esc(u.username)}</div>
                                    </div>
                                </div>
                            </td>
                            <td><strong style="color:#F59E0B; font-family:JetBrains Mono;">${u.battleRating || 1000}</strong></td>
                            <td style="color:#10B981; font-weight:700;">${u.battleWins || 0}</td>
                            <td style="color:#EF4444; font-weight:700;">${u.battleLosses || 0}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>
    `;
}

// ══════════════════════════════════════════
// ACCEPT / REJECT
// ══════════════════════════════════════════
async function acceptBattle(id) {
    const res = await fetch(`/api/battles/${id}/accept`, {
        method: 'POST',
        credentials: 'include'
    });
    const data = await res.json();
    if (data.success) {
        window.location.href = `/battle/${id}`;
    } else {
        alert(data.message || 'Xato');
    }
}

async function rejectBattle(id) {
    if (!confirm('Battle ni rad etishni tasdiqlaysizmi?')) return;
    const res = await fetch(`/api/battles/${id}/reject`, {
        method: 'POST',
        credentials: 'include'
    });
    const data = await res.json();
    if (data.success) loadBattles();
    else alert(data.message);
}

// ══════════════════════════════════════════
// CREATE MODAL
// ══════════════════════════════════════════
function openCreateModal() {
    document.getElementById('createModal').classList.add('active');
    document.getElementById('opponentUsername').focus();
}

function closeCreateModal() {
    document.getElementById('createModal').classList.remove('active');
    document.getElementById('createMessage').innerHTML = '';
    document.getElementById('opponentUsername').value = '';
}

async function createBattle() {
    const username = document.getElementById('opponentUsername').value.trim();
    const count = document.getElementById('challengeCount').value;
    const msg = document.getElementById('createMessage');

    if (!username) {
        msg.innerHTML = '<span style="color:#EF4444;">Raqib username kiriting</span>';
        return;
    }

    msg.innerHTML = '<span style="color:var(--text3);">Yaratilmoqda...</span>';

    try {
        const res = await fetch('/api/battles/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ opponentUsername: username, challengeCount: parseInt(count) })
        });
        const data = await res.json();

        if (data.success) {
            msg.innerHTML = '<span style="color:#10B981;">✅ ' + esc(data.message) + '</span>';
            setTimeout(() => {
                closeCreateModal();
                loadBattles();
            }, 1500);
        } else {
            msg.innerHTML = '<span style="color:#EF4444;">❌ ' + esc(data.message) + '</span>';
        }
    } catch (e) {
        msg.innerHTML = '<span style="color:#EF4444;">Ulanish xatosi</span>';
    }
}

// ══════════════════════════════════════════
// TIMER
// ══════════════════════════════════════════
function updateTimers() {
    document.querySelectorAll('.timer-badge').forEach(el => {
        const expires = new Date(el.dataset.expires).getTime();
        const now = Date.now();
        const diff = expires - now;

        if (diff <= 0) {
            el.textContent = 'TUGADI';
            return;
        }

        const mins = Math.floor(diff / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        el.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    });
}

setInterval(updateTimers, 1000);

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
window.addEventListener('load', async () => {
    try {
        const res = await fetch('/api/auth/me', { credentials: 'include', cache: 'no-store' });
        if (!res.ok) { window.location.replace('/welcome'); return; }
        const data = await res.json();
        if (!data.success || !data.user) { window.location.replace('/welcome'); return; }

        currentUser = data.user;

        const authLink = document.getElementById('auth-link');
        if (authLink) {
            authLink.innerHTML = `<img src="${currentUser.avatar || '/assets/default-avatar.svg'}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:1px solid #2563EB;" onerror="this.src='/assets/default-avatar.svg'">${currentUser.username}`;
        }
    } catch (e) {
        window.location.replace('/welcome');
        return;
    }

    loadTab();
});

// Modal tashqarisiga bosilsa yopish
document.getElementById('createModal').addEventListener('click', (e) => {
    if (e.target.id === 'createModal') closeCreateModal();
});
</script>
