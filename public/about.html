<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biz haqimizda - CTF.UZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{
  --bg:#03060b;
  --blue:#00c8ff;
  --green:#00ff9c;
  --ink:#e8fbff;
  --dim:#6d8fa0;
  --display:"Chakra Petch","Arial Narrow",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--display);}

/* Navbar dizayni (boshqa sahifalar bilan bir xil uslubda) */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 40px;
  background: rgba(3, 6, 11, 0.9);
  border-bottom: 1px solid rgba(0, 200, 255, 0.15);
  backdrop-filter: blur(10px);
}
.navbar .logo {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--blue);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-links {
  display: flex;
  gap: 20px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.nav-links a {
  color: var(--dim);
  text-decoration: none;
  font-size: 0.95rem;
  transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.active {
  color: var(--ink);
}

/* Asosiy Video qismi */
.content-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
  min-height: calc(100vh - 70px);
}
.page-title {
  font-size: 1.8rem;
  margin-bottom: 20px;
  letter-spacing: 2px;
  color: var(--ink);
  text-align: center;
}
.player{position:relative;width:min(100vw - 40px, calc((100vh - 180px) * 16 / 9));aspect-ratio:16/9;background:var(--bg);border-radius:12px;overflow:hidden;box-shadow:0 10px 40px rgba(0,200,255,0.15);border:1px solid rgba(0,200,255,0.25);}
canvas{display:block;width:100%;height:100%}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:10px max(14px,env(safe-area-inset-left,0px));background:linear-gradient(to top,rgba(3,6,11,.85),rgba(3,6,11,0));opacity:0;transition:opacity .25s}
.player:hover .bar,.player:focus-within .bar,.player.show .bar{opacity:1}
.bar button{appearance:none;border:1px solid rgba(0,200,255,.55);background:rgba(3,10,18,.75);color:var(--ink);width:38px;height:38px;display:grid;place-items:center;cursor:pointer;font:700 14px var(--mono)}
.bar button:hover{border-color:var(--green);color:var(--green)}
.bar button:focus-visible,.bar input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.bar input[type=range]{flex:1;min-width:0;accent-color:var(--green);height:24px}
.bar time{font:400 13px var(--mono);color:var(--dim);min-width:84px;text-align:right}
body.render .bar{display:none}
@media (max-width:520px){.bar time{display:none}}
</style>
</head>
<body>

<!-- Sayt menyusi -->
<nav class="navbar">
  <a href="/dashboard" class="logo">⚡ CTF.UZ</a>
  <ul class="nav-links">
    <li><a href="/dashboard">Dashboard</a></li>
    <li><a href="/arena">Arena</a></li>
    <li><a href="/reyting">Reyting</a></li>
    <li><a href="/career">Karyera</a></li>
    <li><a href="/about" class="active">Biz haqimizda</a></li>
  </ul>
</nav>

<div class="content-wrapper">
  <h1 class="page-title">Platforma Taqdimoti (Motion Video)</h1>
  <div class="player" id="player">
    <canvas id="stage" width="1920" height="1080" aria-label="CTF.UZ platformasi haqida motion video"></canvas>
    <div class="bar">
      <button id="pp" type="button" aria-label="Pauza">II</button>
      <input id="seek" type="range" min="0" max="35000" value="0" step="10" aria-label="Video vaqti">
      <time id="tm">0:00 / 0:35</time>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 1920, H = 1080, DUR = 35;
const cv = document.getElementById('stage');
const mainCtx = cv.getContext('2d', { alpha: false });
let ctx = mainCtx;

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };

const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eoExp = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);

const B = a => `rgba(0,200,255,${a})`;
const G = a => `rgba(0,255,156,${a})`;
const FD = '"Chakra Petch","Arial Narrow",sans-serif';
const FM = '"JetBrains Mono",ui-monospace,Menlo,monospace';

function makeSprite(rgb) {
  const c = mk(128, 128), g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(.12, `rgba(${rgb},.65)`);
  gr.addColorStop(.35, `rgba(${rgb},.18)`); gr.addColorStop(1, `rgba(${rgb},0)`);

const SP_B = makeSprite('0,200,255'), SP_G = makeSprite('0,255,156');
function glow(x, y, r, sp, a) {

  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha *= clamp(a);

}

  ctx.save(); ctx.globalAlpha *= clamp(a); ctx.fillStyle = '#eafffd';
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); ctx.restore();
}

}

function txt(s, x, y, o = {}) {

  ctx.save(); ctx.globalAlpha *= clamp(alpha);
  ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = base;
  if ('letterSpacing' in ctx) ctx.letterSpacing = ls + 'px';

}
function measure(s, size, weight, font, ls = 0) {

  const w = ctx.measureText(s).width; ctx.restore(); return w;
}
function rrect(x, y, w, h, r) { ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function brackets(x, y, w, h, len, col, wd, a) {
  glowPath(() => {
    ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y);
    ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len);
    ctx.moveTo(x + w, y + h - len); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - len, y + h);
    ctx.moveTo(x + len, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - len);
  }, col, wd, a);
}

const vign = mk(W, H); {
  const g = vign.getContext('2d'); const gr = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.78)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
const scanC = mk(4, 4); { const g = scanC.getContext('2d'); g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(0, 0, 4, 1.5); }
const scanPat = mainCtx.createPattern(scanC, 'repeat');
const noiseC = mk(256, 256); {
  const g = noiseC.getContext('2d'), im = g.createImageData(256, 256), r = rng(5);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0);

const noisePat = mainCtx.createPattern(noiseC, 'repeat');

const UZ = [[55.97,41.31],[56.0,43.0],[56.0,45.0],[57.8,45.55],[59.6,45.3],[60.8,44.7],[61.6,44.0],[62.4,43.5],[64.2,43.5],[65.8,42.9],[66.1,42.0],[67.5,41.2],[68.6,41.7],[69.6,41.9],[70.5,42.15],[71.2,42.2],[71.0,41.5],[72.0,41.4],[72.9,41.0],[73.15,40.8],[72.4,40.5],[71.6,40.2],[70.7,40.2],[70.2,39.95],[69.3,40.15],[68.6,40.05],[68.0,39.6],[67.6,39.2],[67.9,38.4],[67.7,37.6],[67.2,37.2],[66.5,37.35],[65.7,37.6],[65.8,38.3],[64.8,38.9],[64.0,39.3],[63.5,39.8],[62.5,40.0],[61.4,41.0],[60.4,41.4],[59.0,42.0],[58.0,42.3],[57.0,41.7]];
const K = 150;
const PL = ll => [(ll[0] - 64.5) * 0.75 * K, -(ll[1] - 41.4) * K];
const UZW = UZ.map(PL);
const per = [0]; for (let i = 0; i < UZW.length; i++) { const a = UZW[i], b = UZW[(i + 1) % UZW.length]; per.push(per[i] + Math.hypot(b[0] - a[0], b[1] - a[1])); }
function pip(x, y, pg) { let c = false; for (let i = 0, j = pg.length - 1; i < pg.length; j = i++) { const [xi, yi] = pg[i], [xj, yj] = pg[j]; if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c; } return c; }
const TSH = PL([69.24, 41.3]);
const LAT = []; {
  const r = rng(11);
  for (let y = -640, row = 0; y <= 640; y += 18, row++) for (let x = -980 + (row % 2 ? 10 : 0); x <= 980; x += 20) {
    if (pip(x, y, UZW)) LAT.push({ x, y, d: Math.hypot(x - TSH[0], y - TSH[1]), g: r() < .09, ph: r() * 6.28 });
  }
  LAT.sort((a, b) => a.d - b.d);
}
const CITIES = [
  { n: 'Toshkent', ll: [69.24, 41.31], h: 150, big: 1 }, { n: 'Nurafshon', ll: [69.95, 40.9], h: 60 },
  { n: 'Guliston', ll: [68.78, 40.49], h: 60 }, { n: 'Jizzax', ll: [67.84, 40.12], h: 60 },
  { n: 'Samarqand', ll: [66.96, 39.65], h: 130, big: 1 }, { n: 'Navoiy', ll: [65.38, 40.1], h: 60 },
  { n: 'Buxoro', ll: [64.42, 39.77], h: 120, big: 1 }, { n: 'Qarshi', ll: [65.8, 38.86], h: 60 },
  { n: 'Termiz', ll: [67.4, 37.5], h: 90, big: 1 }, { n: 'Urganch', ll: [60.63, 41.55], h: 60 },
  { n: 'Nukus', ll: [59.6, 42.46], h: 110, big: 1 }, { n: 'Fargʻona', ll: [71.78, 40.38], h: 60 },
  { n: 'Andijon', ll: [72.34, 40.78], h: 60 }, { n: 'Namangan', ll: [71.67, 41.0], h: 60 }
];
CITIES.forEach(c => { c.w = PL(c.ll); c.d = Math.hypot(c.w[0] - TSH[0], c.w[1] - TSH[1]); });
const EDGE_N = [['Toshkent','Nurafshon'],['Toshkent','Guliston'],['Guliston','Jizzax'],['Jizzax','Samarqand'],['Samarqand','Navoiy'],['Navoiy','Buxoro'],['Samarqand','Qarshi'],['Qarshi','Termiz'],['Buxoro','Urganch'],['Urganch','Nukus'],['Toshkent','Namangan'],['Namangan','Andijon'],['Andijon','Fargʻona'],['Fargʻona','Guliston'],['Buxoro','Qarshi']];
const EDGES = EDGE_N.map(([a, b]) => [CITIES.findIndex(c => c.n === a), CITIES.findIndex(c => c.n === b)]);

function scene1(lt) {
  const p = clamp(lt / 5), e = eio(p);
  const cam = { yaw: lerp(-.38, .18, e), tilt: lerp(1.12, .86, e), dist: lerp(1500, 950, e), f: 1600, cx: 960, cy: lerp(650, 615, p) };
  const P3 = (x, y, z) => proj(x, y, z, cam);
  const bg = ctx.createRadialGradient(960, 560, 50, 960, 560, 900);
  bg.addColorStop(0, 'rgba(0,70,110,.35)'); bg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  for (let i = -9; i <= 9; i++) {
    const a1 = P3(i * 200, -1800, -30), a2 = P3(i * 200, 1800, -30), b1 = P3(-1800, i * 200, -30), b2 = P3(1800, i * 200, -30);
    const al = .16 * (1 - Math.abs(i) / 10);
    glowPath(poly([a1, a2]), B, .8, al); glowPath(poly([b1, b2]), B, .8, al);
  }
  for (const [R, sp, al] of [[1050, .5, .32], [1180, -.35, .2]]) {
    for (let k = 0; k < 24; k++) {
      const a0 = k * Math.PI / 12 + lt * sp, pts = [];
      for (let j = 0; j <= 6; j++) { const a = a0 + j * (Math.PI / 12 * .55) / 6; pts.push(P3(Math.cos(a) * R, Math.sin(a) * R * .8, -20)); }
      glowPath(poly(pts), k % 6 === 0 ? G : B, 1.4, al * sstep(.3, 1.5, lt));
    }
  }
  const fr = eo3(clamp((lt - .15) / 2.2)), target = per[per.length - 1] * fr;
  const top = [], bot = [];
  for (let i = 0; i < UZW.length; i++) {
    if (per[i] > target) break;
    top.push(P3(UZW[i][0], UZW[i][1], 24)); bot.push(P3(UZW[i][0], UZW[i][1], 0));
  }
  { const i = top.length; if (i > 0 && i <= UZW.length) { const a = UZW[i - 1], b = UZW[i % UZW.length], seg = per[i] - per[i - 1], u = clamp((target - per[i - 1]) / seg); if (u > 0 && u < 1) { const x = lerp(a[0], b[0], u), y = lerp(a[1], b[1], u); top.push(P3(x, y, 24)); bot.push(P3(x, y, 0)); } } }
  if (fr > .995) { top.push(top[0]); bot.push(bot[0]); }

    ctx.save(); ctx.fillStyle = B(.07 * fr); ctx.beginPath(); poly(bot, fr > .995)(); ctx.fill(); ctx.restore();
    glowPath(poly(bot), B, 2.6, .9); glowPath(poly(top), G, 2.2, .85);
    for (let i = 0; i < top.length; i += 3) glowPath(poly([bot[i], top[i]]), B, 1, .22);
    const head = top[top.length - 1]; if (fr < .995) { glow(head[0], head[1], 46, SP_G, 1); core(head[0], head[1], 5, 1); }
  }
  const rr = lerp(0, 1800, eo3(clamp((lt - .5) / 2.8)));
  for (const gcol of [false, true]) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let bucket = 0; bucket < 3; bucket++) {
      ctx.fillStyle = gcol ? G(.35 + bucket * .22) : B(.2 + bucket * .17);

        if (q.d > rr) break;

        const [X, Y, s] = P3(q.x, q.y, 0), z = 2 * s + 1;
        ctx.rect(X - z / 2, Y - z / 2, z, z);
      }
      ctx.fill();
    }
    ctx.restore();
  }
  { const ra = ((lt * 520) % 1500), pts = []; for (let a = 0; a <= 48; a++) { const t2 = a / 48 * 6.2832; pts.push(P3(TSH[0] + Math.cos(t2) * ra, TSH[1] + Math.sin(t2) * ra * .9, 2)); } glowPath(poly(pts), B, 1.2, .22 * (1 - ra / 1500) * sstep(.5, 1.2, lt)); }
  const cA = CITIES.map(c => sstep(c.d - 80, c.d + 60, rr) * sstep(.5, 1.1, lt));
  EDGES.forEach(([i, j], ei) => {
    const A = CITIES[i], Bc = CITIES[j], a = Math.min(cA[i], cA[j]); if (a < .02) return;

    glowPath(poly(pts), B, 1.2, .34 * a);
    for (let k = 0; k < 2; k++) {
      const u = (lt * .32 + ei * .137 + k * .5) % 1;
      for (let tr = 0; tr < 7; tr++) { const uu = u - tr * .012; if (uu < 0) continue; const x = lerp(A.w[0], Bc.w[0], uu), y = lerp(A.w[1], Bc.w[1], uu), q = P3(x, y, Math.sin(Math.PI * uu) * ah); glow(q[0], q[1], (16 - tr * 1.6) * q[2] * 1.6, SP_G, a * (1 - tr / 7)); }
      const x = lerp(A.w[0], Bc.w[0], u), y = lerp(A.w[1], Bc.w[1], u), q = P3(x, y, Math.sin(Math.PI * u) * ah); core(q[0], q[1], 3.2 * q[2] * 1.5 + 1, a);
    }
  });

    const a = cA[i]; if (a < .02) return;

  });

  if (e.code === 'ArrowRight') tcur = Math.min(DUR - .01, tcur + 1);
  if (e.code === 'ArrowLeft') tcur = Math.max(0, tcur - 1);
});
let hideT; player.addEventListener('pointermove', () => { player.classList.add('show'); clearTimeout(hideT); hideT = setTimeout(() => player.classList.remove('show'), 2200); });

const fontJobs = ['700 100px "Chakra Petch"', '500 40px "Chakra Petch"', '700 100px "JetBrains Mono"', '400 30px "JetBrains Mono"'].map(f => document.fonts.load(f, 'ABC 0123 ʻ—'));
Promise.race([Promise.all(fontJobs), new Promise(r => setTimeout(r, 3500))]).catch(() => { }).then(() => {
  window.__ready = true; render(0);
  if (!renderMode) requestAnimationFrame(n => { last = n; tick(n); });
});
})();
