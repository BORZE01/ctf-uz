<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish — CTF.UZ</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="girih-bg"></div>

<header class="header">
    <a href="/" class="logo">
        <div class="logo-mark">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
        </div>
        <div class="logo-text">CTF<span>.UZ</span></div>
    </a>
    
    <nav class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/arena">Arena</a>
        <a href="/learn">O'rganish</a>
        <a href="/battle">Battle</a>
        <a href="/leaderboard">Reyting</a>
        <a href="/career">Karyera</a>
        <a id="auth-link" href="/profile"></a>
    </nav>

</header>

<div class="container-narrow">
    <div class="card-glass fade-in-up" style="max-width: 560px; margin: 40px auto; padding: 40px;">
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="width: 64px; height: 64px; margin: 0 auto 16px; background: linear-gradient(135deg, var(--uz-blue, #2563EB), var(--accent-cyan, #22D3EE)); border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(37,99,235,0.4);">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M22 11h-6M19 8v6"/>
                </svg>
            </div>
            <h2 style="margin-bottom: 8px; font-family: Manrope; font-weight: 800;">Ro'yxatdan o'tish</h2>
            <p style="color: var(--text-secondary, #94A3B8); font-size: 0.9rem;">Cyber ID yarating va arenaga kiring</p>
        </div>

        <form id="register-form">
            <div class="input-group">
                <input type="text" id="reg-name" placeholder=" " required>
                <label>To'liq ism</label>
            </div>

            <div class="input-group">
                <input type="text" id="reg-username" placeholder=" " required>
                <label>Telegram username</label>
                <span class="hint">Xoziroq @tasdiqlovchi_ctf_bot ga /start bosing</span>
            </div>

            <div class="input-group">
                <input type="text" id="reg-phone" placeholder=" " value="+998 " required>
                <label>Telefon raqam</label>
                <span class="hint">Format: +998 XX XXX XX XX</span>
            </div>

            <div class="input-group">
                <input type="email" id="reg-email" placeholder=" " required>
                <label>Email</label>
            </div>

            <!-- TURAR JOY -->
            <div style="padding: 20px; background: rgba(37,99,235,0.05); border: 1px solid rgba(74,127,255,0.2); border-radius: 12px; margin-bottom: 20px;">
                <h4 style="margin-bottom: 16px; color: var(--uz-blue, #2563EB); font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; gap: 8px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                    Turar joy
                </h4>
                
                <div class="input-group">
                    <select id="reg-region" required style="width: 100%; padding: 14px 16px; background: var(--surface, #0F1629); border: 1px solid rgba(30,94,255,0.15); border-radius: 6px; color: var(--text-primary, #F1F5F9); font-family: inherit; outline: none;">
                        <option value="">Viloyatni tanlang</option>
                    </select>
                    <label>Viloyat / Respublika</label>
                </div>

                <div class="input-group">
                    <select id="reg-location-type" required style="width: 100%; padding: 14px 16px; background: var(--surface, #0F1629); border: 1px solid rgba(30,94,255,0.15); border-radius: 6px; color: var(--text-primary, #F1F5F9); font-family: inherit; outline: none;">
                        <option value="">Turi</option>
                        <option value="city">Shahar</option>
                        <option value="district">Tuman</option>
                    </select>
                    <label>Shahar / Tuman</label>
                </div>

                <div class="input-group">
                    <select id="reg-location" required disabled style="width: 100%; padding: 14px 16px; background: var(--surface, #0F1629); border: 1px solid rgba(30,94,255,0.15); border-radius: 6px; color: var(--text-primary, #F1F5F9); font-family: inherit; outline: none;">
                        <option value="">Avval viloyat va turni tanlang</option>
                    </select>
                    <label>Shahar / Tuman nomi</label>
                </div>
            </div>

            <div class="input-group">
                <input type="password" id="reg-pass" placeholder=" " required minlength="6">
                <label>Parol</label>
                <span class="hint">Kamida 6 ta belgi</span>
            </div>

            <div class="input-group">
                <input type="password" id="reg-confirm" placeholder=" " required>
                <label>Parolni tasdiqlash</label>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
                Ro'yxatdan o'tish
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </form>

        <div id="register-message" class="msg-box"></div>

        <p style="text-align: center; margin-top: 24px; color: var(--text-secondary, #94A3B8); font-size: 0.85rem;">
            Hisobingiz bormi? <a href="/login" style="color: var(--uz-blue, #2563EB); text-decoration: none; font-weight: 600;">Kirish</a>
        </p>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/preloader.js"></script>
<script>
// ══════════════════════════════════════════
// TELEFON FORMATI
// ══════════════════════════════════════════
document.getElementById('reg-phone').addEventListener('input', function() {
    let digits = this.value.replace(/[^0-9]/g, '');
    if (!digits.startsWith('998')) digits = '998' + digits.replace(/^998/, '');
    digits = digits.substring(0, 12);
    let formatted = '+998';
    if (digits.length > 3) formatted += ' ' + digits.substring(3, 5);
    if (digits.length > 5) formatted += ' ' + digits.substring(5, 8);
    if (digits.length > 8) formatted += ' ' + digits.substring(8, 10);
    if (digits.length > 10) formatted += ' ' + digits.substring(10, 12);
    this.value = formatted;
});

// ══════════════════════════════════════════
// LOCATION LOADING
// ══════════════════════════════════════════
let locationData = {};

async function loadRegions() {
    try {
        const res = await fetch('/api/locations/regions');
        const data = await res.json();
        
        if (!data.success) {
            console.error('Viloyatlar yuklanmadi');
            return;
        }

        const select = document.getElementById('reg-region');
        // Tozalash
        select.innerHTML = '<option value="">Viloyatni tanlang</option>';
        
        data.regions.forEach(r => {
            const opt = document.createElement('option');
            opt.value = r.name;
            opt.textContent = r.name;
            select.appendChild(opt);
        });
    } catch (err) {
        console.error('Location xatosi:', err);
    }
}

async function loadLocations(region) {
    try {
        const res = await fetch(`/api/locations/regions/${encodeURIComponent(region)}`);
        const data = await res.json();
        
        if (!data.success) return;
        
        locationData = {
            cities: data.cities || [],
            districts: data.districts || []
        };
    } catch (err) {
        console.error('Location xatosi:', err);
    }
}

// Viloyat tanlanganda
document.getElementById('reg-region').addEventListener('change', async function() {
    const region = this.value;
    const typeSelect = document.getElementById('reg-location-type');
    const locationSelect = document.getElementById('reg-location');

    // Type select ni reset qilish
    typeSelect.value = '';
    typeSelect.disabled = false;
    
    // Location select ni reset qilish
    locationSelect.innerHTML = '<option value="">Avval turni tanlang</option>';
    locationSelect.disabled = true;

    if (region) {
        await loadLocations(region);
    }
});

// Tur tanlanganda (shahar/tuman)
document.getElementById('reg-location-type').addEventListener('change', function() {
    const type = this.value;
    const locationSelect = document.getElementById('reg-location');

    // Tozalash
    locationSelect.innerHTML = '<option value="">Tanlang</option>';

    if (!type || !locationData) {
        locationSelect.disabled = true;
        return;
    }

    const list = type === 'city' ? locationData.cities : locationData.districts;
    
    list.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        opt.textContent = item;
        locationSelect.appendChild(opt);
    });

    locationSelect.disabled = false;
});

// ══════════════════════════════════════════
// RO'YXATDAN O'TISH
// ══════════════════════════════════════════
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('reg-name').value.trim();
    const username = document.getElementById('reg-username').value.trim();
    const phone = document.getElementById('reg-phone').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const region = document.getElementById('reg-region').value;
    const locationType = document.getElementById('reg-location-type').value;
    const locationValue = document.getElementById('reg-location').value;
    const password = document.getElementById('reg-pass').value;
    const confirm = document.getElementById('reg-confirm').value;
    const msg = document.getElementById('register-message');

    // Validatsiya
    if (!name || !username || !phone || !email || !region || !locationType || !locationValue || !password) {
        msg.className = 'msg-box error';
        msg.innerText = 'Barcha maydonlarni to\'ldiring';
        return;
    }

    if (password !== confirm) {
        msg.className = 'msg-box error';
        msg.innerText = 'Parollar mos kelmadi';
        return;
    }

    if (password.length < 6) {
        msg.className = 'msg-box error';
        msg.innerText = 'Parol kamida 6 ta belgidan iborat bo\'lishi kerak';
        return;
    }

    const cleanPhone = phone.replace(/[^0-9]/g, '');
    if (cleanPhone.length !== 12) {
        msg.className = 'msg-box error';
        msg.innerText = 'Telefon raqam to\'liq emas';
        return;
    }

    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.innerText = 'Yuborilmoqda...';

    try {
        const csrfRes = await fetch('/api/csrf-token', { credentials: 'include' });
        const csrfData = await csrfRes.json();

        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'x-csrf-token': csrfData.csrfToken
            },
            credentials: 'include',
            body: JSON.stringify({
                name,
                username,
                phone: cleanPhone,
                email,
                password,
                region,
                city: locationType === 'city' ? locationValue : '',
                district: locationType === 'district' ? locationValue : ''
            })
        });
        const data = await res.json();

        if (data.success) {
            msg.className = 'msg-box success';
            msg.innerText = data.message;
            sessionStorage.setItem('pendingEmail', email);
            setTimeout(() => window.location.href = '/verify', 1500);
        } else {
            msg.className = 'msg-box error';
            msg.innerText = data.message || 'Xato';
            btn.disabled = false;
            btn.innerText = 'Ro\'yxatdan o\'tish';
        }
    } catch (err) {
        msg.className = 'msg-box error';
        msg.innerText = 'Ulanish xatosi';
        btn.disabled = false;
        btn.innerText = 'Ro\'yxatdan o\'tish';
    }
});

// Sahifa yuklanganda
window.addEventListener('load', loadRegions);
</script>
</body>
</html>
