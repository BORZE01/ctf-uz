<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish — CTF.UZ</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="girih-bg"></div>

<header class="header">
    <a href="/" class="logo">
        <div class="logo-mark">CU</div>
        <div class="logo-text">CTF<span>.UZ</span></div>
    </a>
    <nav class="nav">
        <a href="/arena">Arena</a>
        <a href="/learn">O'rganish</a>
        <a href="/leaderboard">Reyting</a>
        <a href="/login" class="nav-cta">Kirish</a>
    </nav>
</header>

<div class="container-narrow">
    <div class="card-glass fade-in-up" style="max-width: 560px; margin: 40px auto; padding: 40px;">
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="width: 60px; height: 60px; margin: 0 auto 16px; background: linear-gradient(135deg, var(--uz-blue), var(--accent-cyan)); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; box-shadow: var(--glow-blue);">
                📝
            </div>
            <h2 style="margin-bottom: 8px;">Ro'yxatdan o'tish</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Cyber ID yarating va arenaga kiring</p>
        </div>

        <form id="register-form">
            <div class="input-group">
                <input type="text" id="reg-name" placeholder=" " required>
                <label>To'liq ism</label>
            </div>

            <div class="input-group">
                <input type="text" id="reg-username" placeholder=" " required>
                <label>Telegram username</label>
                <span class="hint">@tasd2bot ga /start bosing</span>
            </div>

            <div class="input-group">
                <input type="text" id="reg-phone" placeholder=" " value="+998 " required>
                <label>Telefon raqam</label>
                <span class="hint">Format: +998 XX XXX XX XX</span>
            </div>

            <div class="input-group">
                <input type="email" id="reg-email" placeholder=" " required>
                <label>Email</label>
            </div>

            <!-- TURAR JOY PANELI -->
            <div style="padding: 20px; background: rgba(37,99,235,0.05); border: 1px solid rgba(74,127,255,0.2); border-radius: 12px; margin-bottom: 20px;">
                <h4 style="margin-bottom: 16px; color: var(--uz-blue); font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase;">
                    📍 Turar joy
                </h4>
                
                <div class="input-group">
                    <select id="reg-region" required style="width: 100%; padding: 14px 16px; background: var(--surface); border: 1px solid rgba(30,94,255,0.15); border-radius: 6px; color: var(--text-primary); font-family: inherit; outline: none;">
                        <option value="">Viloyatni tanlang</option>
                    </select>
                    <label>Viloyat / Respublika</label>
                </div>

                <div class="input-group">
                    <select id="reg-location-type" required style="width: 100%; padding: 14px 16px; background: var(--surface); border: 1px solid rgba(30,94,255,0.15); border-radius: 6px; color: var(--text-primary); font-family: inherit; outline: none;">
                        <option value="">Turi</option>
                        <option value="city">Shahar</option>
                        <option value="district">Tuman</option>
                    </select>
                    <label>Shahar / Tuman</label>
                </div>

                <div class="input-group">
                    <select id="reg-location" required disabled style="width: 100%; padding: 14px 16px; background: var(--surface); border: 1px solid rgba(30,94,255,0.15); border-radius: 6px; color: var(--text-primary); font-family: inherit; outline: none;">
                        <option value="">Avval viloyat va turni tanlang</option>
                    </select>
                    <label>Shahar / Tuman nomi</label>
                </div>
            </div>

            <div class="input-group">
                <input type="password" id="reg-pass" placeholder=" " required minlength="6">
                <label>Parol</label>
                <span class="hint">Kamida 6 ta belgi</span>
            </div>

            <div class="input-group">
                <input type="password" id="reg-confirm" placeholder=" " required>
                <label>Parolni tasdiqlash</label>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Ro'yxatdan o'tish →</button>
        </form>

        <div id="register-message" class="msg-box"></div>

        <p style="text-align: center; margin-top: 24px; color: var(--text-secondary); font-size: 0.85rem;">
            Hisobingiz bormi? <a href="/login" style="color: var(--uz-blue); text-decoration: none; font-weight: 600;">Kirish</a>
        </p>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
// === TELEFON FORMATI ===
document.getElementById('reg-phone').addEventListener('input', function() {
    let digits = this.value.replace(/[^0-9]/g, '');
    if (!digits.startsWith('998')) digits = '998' + digits.replace(/^998/, '');
    digits = digits.substring(0, 12);
    let formatted = '+998';
    if (digits.length > 3) formatted += ' ' + digits.substring(3, 5);
    if (digits.length > 5) formatted += ' ' + digits.substring(5, 8);
    if (digits.length > 8) formatted += ' ' + digits.substring(8, 10);
    if (digits.length > 10) formatted += ' ' + digits.substring(10, 12);
    this.value = formatted;
});

// === LOCATION LOADING ===
let locationData = {};

async function loadRegions() {
    try {
        const res = await fetch('/api/locations/regions');
        const data = await res.json();
        
        if (!data.success) {
            console.error('Viloyatlar yuklanmadi');
            return;
        }

        const select = document.getElementById('reg-region');
        data.regions.forEach(r => {
            const opt = document.createElement('option');
            opt.value = r.name;
            opt.textContent = r.name;
            select.appendChild(opt);
        });
    } catch (err) {
        console.error('Location xatosi:', err);
    }
}

async function loadLocations(region) {
    try {
        const res = await fetch(`/api/locations/regions/${encodeURIComponent(region)}`);
        const data = await res.json();
        
        if (!data.success) return;
        
        locationData = {
            cities: data.cities || [],
            districts: data.districts || []
        };
    } catch (err) {
        console.error('Location xatosi:', err);
    }
}

// Viloyat tanlanganda
document.getElementById('reg-region').addEventListener('change', async function() {
    const region = this.value;
    const typeSelect = document.getElementById('reg-location-type');
    const locationSelect = document.getElementById('reg-location');

    typeSelect.value = '';
    locationSelect.innerHTML = '<option value="">Avval turni tanlang</option>';
    locationSelect.disabled = true;

    if (region) {
        await loadLocations(region);
        typeSelect.disabled = false;
    } else {
        typeSelect.disabled = true;
    }
});

// Tur tanlanganda (shahar/tuman)
document.getElementById('reg-location-type').addEventListener('change', function() {
    const type = this.value;
    const locationSelect = document.getElementById('reg-location');

    locationSelect.innerHTML = '<option value="">Tanlang</option>';

    if (!type || !locationData) {
        locationSelect.disabled = true;
        return;
    }

    const list = type === 'city' ? locationData.cities : locationData.districts;
    
    list.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        opt.textContent = item;
        locationSelect.appendChild(opt);
    });

    locationSelect.disabled = false;
});

// === RO'YXATDAN O'TISH ===
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('reg-name').value.trim();
    const username = document.getElementById('reg-username').value.trim();
    const phone = document.getElementById('reg-phone').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const region = document.getElementById('reg-region').value;
    const locationType = document.getElementById('reg-location-type').value;
    const locationValue = document.getElementById('reg-location').value;
    const password = document.getElementById('reg-pass').value;
    const confirm = document.getElementById('reg-confirm').value;
    const msg = document.getElementById('register-message');

    // Validatsiya
    if (!name || !username || !phone || !email || !region || !locationType || !locationValue || !password) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Barcha maydonlarni to\'ldiring';
        return;
    }

    if (password !== confirm) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Parollar mos kelmadi';
        return;
    }

    if (password.length < 6) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Parol kamida 6 ta belgidan iborat bo\'lishi kerak';
        return;
    }

    const cleanPhone = phone.replace(/[^0-9]/g, '');
    if (cleanPhone.length !== 12) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Telefon raqam to\'liq emas';
        return;
    }

    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.innerText = 'Yuborilmoqda...';

    try {
        const res = await API.post('/auth/register', {
            name,
            username,
            phone: cleanPhone,
            email,
            password,
            region,
            city: locationType === 'city' ? locationValue : '',
            district: locationType === 'district' ? locationValue : ''
        });

        if (res.success) {
            msg.className = 'msg-box success';
            msg.innerText = '✅ ' + res.message;
            sessionStorage.setItem('pendingEmail', email);
            setTimeout(() => window.location.href = '/verify', 1500);
        } else {
            msg.className = 'msg-box error';
            msg.innerText = '❌ ' + res.message;
            btn.disabled = false;
            btn.innerText = 'Ro\'yxatdan o\'tish →';
        }
    } catch (err) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Ulanish xatosi';
        btn.disabled = false;
        btn.innerText = 'Ro\'yxatdan o\'tish →';
    }
});

// Sahifa yuklanganda viloyatlarni yuklash
window.addEventListener('load', loadRegions);
</script>
</body>
</html>
