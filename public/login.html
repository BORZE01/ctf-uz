<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish — CTF.UZ</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="girih-bg"></div>

<header class="header">
    <a href="/" class="logo">
        <div class="logo-mark">CU</div>
        <div class="logo-text">CTF<span>.UZ</span></div>
    </a>
    <nav class="nav">
        <a href="/arena">Arena</a>
        <a href="/learn">O'rganish</a>
        <a href="/leaderboard">Reyting</a>
        <a href="/register" class="nav-cta">Ro'yxatdan o'tish</a>
    </nav>
</header>

<div class="container-narrow">
    <div class="card-glass fade-in-up" style="max-width: 450px; margin: 80px auto; padding: 40px;">
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="width: 60px; height: 60px; margin: 0 auto 16px; background: linear-gradient(135deg, var(--uz-blue), var(--accent-cyan)); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; box-shadow: var(--glow-blue);">
                🔐
            </div>
            <h2 style="margin-bottom: 8px;">Kirish</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Cyber ID ingizga kiring</p>
        </div>

        <form id="login-form">
            <div class="input-group">
                <input type="text" id="login-user" placeholder=" " required>
                <label>Username yoki Email</label>
            </div>
            <div class="input-group">
                <input type="password" id="login-pass" placeholder=" " required>
                <label>Parol</label>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Kirish →</button>
        </form>

        <div id="login-message" class="msg-box"></div>

       <p style="text-align: center; margin-top: 16px; color: var(--text-secondary); font-size: 0.85rem;">
    <a href="/forgot-password" style="color: var(--text-muted); text-decoration: none;">Parolni unutdingizmi?</a>
</p>
<p style="text-align: center; margin-top: 12px; color: var(--text-secondary); font-size: 0.85rem;">
    Hisobingiz yo'qmi? <a href="/register" style="color: var(--uz-blue); text-decoration: none; font-weight: 600;">Ro'yxatdan o'ting</a>
</p>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('login-user').value.trim();
    const password = document.getElementById('login-pass').value.trim();
    const msg = document.getElementById('login-message');
    const btn = e.target.querySelector('button[type="submit"]');

    if (!username || !password) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Barcha maydonlarni to\'ldiring';
        return;
    }

    btn.disabled = true;
    btn.innerText = 'Kirish...';

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
            msg.className = 'msg-box success';
            msg.innerText = '✅ ' + data.message;

            // Redirect - sessionStorage dan yoki dashboard
            const redirect = sessionStorage.getItem('redirectAfterLogin') || '/dashboard';
            sessionStorage.removeItem('redirectAfterLogin');

            setTimeout(() => {
                window.location.href = redirect;
            }, 800);
        } else {
            msg.className = 'msg-box error';
            msg.innerText = '❌ ' + data.message;
            btn.disabled = false;
            btn.innerText = 'Kirish →';
        }
    } catch (err) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Ulanish xatosi';
        btn.disabled = false;
        btn.innerText = 'Kirish →';
    }
});
</script>
</body>
</html>
