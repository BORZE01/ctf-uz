<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish — CTF.UZ</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
    /* Zamonaviy OTP (2FA) Inputlari */
    #login-view { display: block; }
    #twofa-view { display: none; text-align: center; animation: fadeInUp 0.4s ease forwards; }
    
    .otp-wrapper {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 30px 0;
        direction: ltr;
    }
    .otp-digit {
        width: 55px;
        height: 65px;
        font-size: 28px;
        font-weight: 800;
        font-family: 'JetBrains Mono', monospace;
        text-align: center;
        background: rgba(15,22,41,0.8);
        border: 2px solid rgba(74,127,255,0.2);
        border-radius: 14px;
        color: #fff;
        transition: all 0.3s ease;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }
    .otp-digit:focus {
        border-color: #22D3EE;
        box-shadow: 0 0 15px rgba(34,211,238,0.3), inset 0 2px 4px rgba(0,0,0,0.5);
        outline: none;
        transform: translateY(-2px);
    }
    .otp-digit::selection { background: transparent; }
    
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

</head>
<body>

<div class="girih-bg"></div>

<header class="header">
    <a href="/" class="logo">
        <div class="logo-mark">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
        </div>
        <div class="logo-text">CTF<span>.UZ</span></div>
    </a>
    <nav class="nav">
        <a href="/register" class="nav-cta">Ro'yxatdan o'tish</a>
    </nav>
</header>

<div class="container-narrow">
    <div class="card-glass fade-in-up" style="max-width: 450px; margin: 80px auto; padding: 40px;">
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="width: 64px; height: 64px; margin: 0 auto 16px; background: linear-gradient(135deg, var(--uz-blue, #2563EB), var(--accent-cyan, #22D3EE)); border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(37,99,235,0.4);">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <h2 style="margin-bottom: 8px; font-family: Manrope; font-weight: 800;">Kirish</h2>
            <p style="color: var(--text-secondary, #94A3B8); font-size: 0.9rem;">Cyber ID ingizga kiring</p>
        </div>

        <div id="login-view">
<form id="login-form">
            <div class="input-group">
                <input type="text" id="login-user" placeholder=" " required>
                <label>Username yoki Email</label>
            </div>
            <div class="input-group">
                <input type="password" id="login-pass" placeholder=" " required>
                <label>Parol</label>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
                Kirish
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </form>

        


        <div id="login-message" class="msg-box"></div>
</div>

        <div id="twofa-view">
            <div style="width: 70px; height: 70px; margin: 0 auto 20px; background: linear-gradient(135deg, #10B981, #059669); border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(16,185,129,0.3);">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h2 style="font-family: Manrope; font-weight: 900; font-size: 1.8rem; margin-bottom: 10px; color: #fff;">Xavfsizlik tekshiruvi</h2>
            <p style="color: #94A3B8; font-size: 0.95rem;">Google Authenticator'dagi 6 xonali kodni kiriting.</p>
            
            <form id="twofa-form-modern">
                <div class="otp-wrapper" id="otp-inputs">
                    <input type="text" class="otp-digit" maxlength="1" pattern="[0-9]" inputmode="numeric" required autocomplete="off">
                    <input type="text" class="otp-digit" maxlength="1" pattern="[0-9]" inputmode="numeric" required autocomplete="off">
                    <input type="text" class="otp-digit" maxlength="1" pattern="[0-9]" inputmode="numeric" required autocomplete="off">
                    <input type="text" class="otp-digit" maxlength="1" pattern="[0-9]" inputmode="numeric" required autocomplete="off">
                    <input type="text" class="otp-digit" maxlength="1" pattern="[0-9]" inputmode="numeric" required autocomplete="off">
                    <input type="text" class="otp-digit" maxlength="1" pattern="[0-9]" inputmode="numeric" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; justify-content: center; font-size: 1.1rem; height: 55px; box-shadow: 0 10px 25px rgba(37,99,235,0.4);">
                    Tasdiqlash
                </button>
                <button type="button" onclick="cancel2FA()" class="btn btn-outline" style="width: 100%; justify-content: center; margin-top: 12px; border: none; color: #94A3B8;">
                    Orqaga qaytish
                </button>
            </form>
        </div>


        <p style="text-align: center; margin-top: 16px; color: var(--text-secondary, #94A3B8); font-size: 0.85rem;">
            <a href="/forgot-password" style="color: var(--text-muted, #64748B); text-decoration: none;">Parolni unutdingizmi?</a>
        </p>
        <p style="text-align: center; margin-top: 12px; color: var(--text-secondary, #94A3B8); font-size: 0.85rem;">
            Hisobingiz yo'qmi? <a href="/register" style="color: var(--uz-blue, #2563EB); text-decoration: none; font-weight: 600;">Ro'yxatdan o'ting</a>
        </p>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/preloader.js"></script>


<script>
// OTP Input Logic
const otpInputs = document.querySelectorAll('.otp-digit');
otpInputs.forEach((input, index) => {
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
            otpInputs[index - 1].focus();
        }
    });
    input.addEventListener('input', (e) => {
        if (e.target.value && index < otpInputs.length - 1) {
            otpInputs[index + 1].focus();
        }
    });
    input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pastedData = e.clipboardData.getData('text').slice(0, 6).replace(/\D/g, '');
        for (let i = 0; i < pastedData.length; i++) {
            if (otpInputs[i]) {
                otpInputs[i].value = pastedData[i];
                if (i < 5) otpInputs[i + 1].focus();
            }
        }
    });
});

function cancel2FA() {
    document.getElementById('twofa-view').style.display = 'none';
    document.getElementById('login-view').style.display = 'block';
    document.getElementById('login-message').className = 'msg-box';
    document.getElementById('login-message').innerText = '';
    otpInputs.forEach(i => i.value = '');
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('login-user').value.trim();
    const password = document.getElementById('login-pass').value.trim();
    const msg = document.getElementById('login-message');
    const btn = e.target.querySelector('button[type="submit"]');

    if (!username || !password) return;
    btn.disabled = true; btn.innerText = 'Kutib turing...';

    try {
        const csrfRes = await fetch('/api/csrf-token', { credentials: 'include' });
        const csrfData = await csrfRes.json();

        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfData.csrfToken },
            credentials: 'include',
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
            if (data.requires2FA) {
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('twofa-view').style.display = 'block';
                otpInputs[0].focus();
            } else {
                msg.className = 'msg-box success'; msg.innerText = data.message;
                const redirect = sessionStorage.getItem('redirectAfterLogin') || '/dashboard';
                sessionStorage.removeItem('redirectAfterLogin');
                setTimeout(() => { window.location.href = redirect; }, 500);
            }
        } else {
            msg.className = 'msg-box error'; msg.innerText = data.message || 'Xato';
        }
    } catch (err) {
        msg.className = 'msg-box error'; msg.innerText = 'Ulanish xatosi';
    } finally {
        btn.disabled = false; btn.innerHTML = `Kirish <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
    }
});

document.getElementById('twofa-form-modern').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    let token = '';
    otpInputs.forEach(i => token += i.value);
    
    if (token.length !== 6) return;

    btn.disabled = true; btn.innerText = 'Tekshirilmoqda...';

    try {
        const csrfRes = await fetch('/api/csrf-token', { credentials: 'include' });
        const csrfData = await csrfRes.json();

        const res = await fetch('/api/auth/verify-login-2fa', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfData.csrfToken },
            credentials: 'include',
            body: JSON.stringify({ token })
        });
        const data = await res.json();

        if (data.success) {
            btn.style.background = '#10B981'; btn.innerText = "Tasdiqlandi!";
            const redirect = sessionStorage.getItem('redirectAfterLogin') || '/dashboard';
            sessionStorage.removeItem('redirectAfterLogin');
            setTimeout(() => { window.location.href = redirect; }, 500);
        } else {
            btn.style.background = '#EF4444'; btn.innerText = data.message;
            otpInputs.forEach(i => i.value = ''); otpInputs[0].focus();
            setTimeout(() => { btn.style.background = ''; btn.innerText = 'Tasdiqlash'; btn.disabled = false; }, 2000);
        }
    } catch (err) {
        btn.disabled = false; btn.innerText = 'Xatolik yuz berdi';
    }
});
</script>


</body>
</html>
