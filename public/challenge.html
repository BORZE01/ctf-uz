<body>

<div class="girih-bg"></div>

<header class="header">
    <a href="/" class="logo"><div class="logo-mark">CU</div><div class="logo-text">CTF<span>.UZ</span></div></a>
    
    <nav class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/arena" class="active">Arena</a>
        <a href="/learn">O'rganish</a>
        <a href="/battle">Battle</a>
        <a href="/leaderboard">Reyting</a>
        <a href="/career">Karyera</a>
        <a id="auth-link" href="/profile"></a>
    </nav>

</header>

<div class="container-narrow">
    <div id="challenge-content">
        <div class="spinner"></div>
    </div>
</div>

<script src="/js/api.js">
async function buyHint(challengeId, hintIndex, cost) {
    const ok = confirm("Maslahatni (Hint " + (hintIndex + 1) + ") " + cost + " XP evaziga ochishni xohlaysizmi?\n\nSizning balansingizdan " + cost + " ball chegiriladi.");
    if (!ok) return;

    try {
        const res = await fetch("/api/challenges/" + challengeId + "/hints/buy", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ hintIndex })
        });
        const data = await res.json();
        if (!data.success) {
            alert(data.message || "Xatolik yuz berdi");
            return;
        }
        alert("🎉 " + (data.message || "Maslahat muvaffaqiyatli ochildi!"));
        window.location.reload();
    } catch (e) {
        alert("Server bilan boglanishda xatolik yuz berdi!");
    }
}


function renderHints(challenge) {
    if (!challenge.hints || challenge.hints.length === 0) return "";
    let out = '<div style="margin-bottom: 24px;"><h4 style="margin-bottom: 12px; color: var(--warning);">💡 Maslahatlar (Ishoralar)</h4>';
    
    challenge.hints.forEach((h, i) => {
        const text = typeof h === 'object' ? (h.text || '') : h;
        const rate = i === 0 ? 0.20 : (i === 1 ? 0.40 : 0.50);
        const cost = Math.round((challenge.points || 100) * rate);
        const isUnlocked = h.isUnlocked || (text !== 'LOCKED' && text !== 'HIDDEN' && text !== '');
        
        if (isUnlocked) {
            out += '<div style="margin-bottom: 10px; padding: 14px 18px; background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 10px;">';
            out += '<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">';
            out += '<span style="color: #10B981; font-weight: 700; font-size: 0.85rem;">🔓 Hint ' + (i + 1) + ' (Ochilgan)</span>';
            out += '<span style="font-size: 0.75rem; color: var(--text-muted);">-' + cost + ' XP</span></div>';
            out += '<p style="color: var(--text-primary); margin: 0; line-height: 1.6; font-size: 0.9rem;">' + text + '</p></div>';
        } else {
            const perc = i === 0 ? "-20%" : (i === 1 ? "-40%" : "-50%");
            out += '<div style="margin-bottom: 10px; padding: 14px 18px; background: rgba(245, 158, 11, 0.05); border: 1px dashed rgba(245, 158, 11, 0.35); border-radius: 10px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">';
            out += '<div><div style="color: var(--warning); font-weight: 700; font-size: 0.85rem;">🔒 Hint ' + (i + 1) + ' <span style="font-size: 0.7rem; background: rgba(245,158,11,0.15); color: #F59E0B; padding: 2px 6px; border-radius: 4px;">Qulflangan</span></div>';
            out += '<div style="color: var(--text-secondary); font-size: 0.78rem; margin-top: 3px;">Narxi: <strong style="color: #F59E0B;">' + cost + ' XP</strong> (' + perc + ')</div></div>';
            out += '<button onclick="buyHint(\'' + (challenge._id || challenge.id) + '\', ' + i + ', ' + cost + ')" class="btn btn-warning btn-sm" style="background: #F59E0B; color: #000; font-weight: 700; padding: 7px 16px; border-radius: 8px; cursor: pointer; border: none;">⚡ Ochish (' + cost + ' XP)</button></div>';
        }
    });
    
    out += '</div>';
    return out;
}

async function buyHint(challengeId, hintIndex, cost) {
    if (!confirm("Maslahatni (Hint " + (hintIndex + 1) + ") " + cost + " XP evaziga ochishni xohlaysizmi?\n\nBalansingizdan " + cost + " ball chegiriladi.")) return;
    try {
        const res = await fetch("/api/challenges/" + challengeId + "/hints/buy", {

        const data = await res.json();
        if (!data.success) return alert(data.message || "Xatolik yuz berdi");
        alert("🎉 " + (data.message || "Maslahat muvaffaqiyatli ochildi!"));
        window.location.reload();
    } catch (e) {
        alert("Server bilan boglanishda xatolik yuz berdi!");
    }
}

</script>
<script src="/js/guard.js"></script>
<script>

window.escapeHtml = window.escapeHtml || function(text) {
    if (!text) return "";
    return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
};

window.renderHints = function(challenge) {
    if (!challenge || !challenge.hints || challenge.hints.length === 0) return "";
    let out = '<div style="margin-bottom: 24px;"><h4 style="margin-bottom: 12px; color: var(--warning);">💡 Maslahatlar (Ishoralar)</h4>';
    challenge.hints.forEach((h, i) => {
        const text = typeof h === 'object' ? (h.text || '') : h;
        const rate = i === 0 ? 0.20 : (i === 1 ? 0.40 : 0.50);
        const cost = Math.round((challenge.points || 100) * rate);
        const isUnlocked = h.isUnlocked || (text && text !== 'LOCKED' && text !== 'HIDDEN');
        
        if (isUnlocked) {
            out += '<div style="margin-bottom: 10px; padding: 14px 18px; background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 10px;"><div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;"><span style="color: #10B981; font-weight: 700; font-size: 0.85rem;">🔓 Hint ' + (i + 1) + ' (Ochilgan)</span><span style="font-size: 0.75rem; color: var(--text-muted);">-' + cost + ' XP</span></div><p style="color: var(--text-primary); margin: 0; line-height: 1.6; font-size: 0.9rem;">' + window.escapeHtml(text) + '</p></div>';
        } else {
            const perc = i === 0 ? "-20%" : (i === 1 ? "-40%" : "-50%");
            out += '<div style="margin-bottom: 10px; padding: 14px 18px; background: rgba(245, 158, 11, 0.05); border: 1px dashed rgba(245, 158, 11, 0.35); border-radius: 10px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;"><div><div style="color: var(--warning); font-weight: 700; font-size: 0.85rem;">🔒 Hint ' + (i + 1) + ' <span style="font-size: 0.7rem; background: rgba(245,158,11,0.15); color: #F59E0B; padding: 2px 6px; border-radius: 4px;">Qulflangan</span></div><div style="color: var(--text-secondary); font-size: 0.78rem; margin-top: 3px;">Narxi: <strong style="color: #F59E0B;">' + cost + ' XP</strong> (' + perc + ')</div></div><button onclick="window.buyHint(\'' + (challenge._id || challenge.id) + '\', ' + i + ', ' + cost + ')" class="btn btn-warning btn-sm" style="background: #F59E0B; color: #000; font-weight: 700; padding: 7px 16px; border-radius: 8px; cursor: pointer; border: none;">⚡ Ochish (' + cost + ' XP)</button></div>';
        }
    });
    out += '</div>';
    return out;
};

window.buyHint = async function(challengeId, hintIndex, cost) {
    if (!confirm("Maslahatni (Hint " + (hintIndex + 1) + ") " + cost + " XP evaziga ochishni xohlaysizmi?\n\nBalansingizdan " + cost + " ball chegiriladi.")) return;
    try {
        const res = await fetch("/api/challenges/" + challengeId + "/hints/buy", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ hintIndex })
        });
        const data = await res.json();
        if (!data.success) return alert(data.message || "Xatolik yuz berdi");
        alert("🎉 " + (data.message || "Maslahat muvaffaqiyatli ochildi!"));
        window.location.reload();
    } catch (e) {
        alert("Server bilan boglanishda xatolik yuz berdi!");
    }
};

let challengeId = null;

async function loadChallenge() {
    const url = new URL(window.location.href);
    const id = url.searchParams.get('id');

    if (!id) {
        window.location.href = '/arena';
        return;
    }

    challengeId = id;

    const res = await API.get('/challenges/' + id);
    if (!res.success) {
        document.getElementById('challenge-content').innerHTML = `
            <div class="card-glass" style="padding: 60px; text-align: center;">
                <h2 style="color: var(--error); margin-bottom: 16px;">❌ Challenge topilmadi</h2>
                <a href="/arena" class="active" class="btn btn-primary">Arenaga qaytish</a>
            </div>
        `;
        return;
    }

    const c = res.challenge;

    document.getElementById('challenge-content').innerHTML = `
        <a href="/arena" class="active" style="color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; display: inline-block; margin-bottom: 24px;">
            ← Arenaga qaytish
        </a>

        <div class="card-glass fade-in-up" style="padding: 40px; margin-bottom: 24px;">
            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
                <div>
                    <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
                        <span class="badge badge-${c.category.toLowerCase()}">${c.category}</span>
                        <span class="badge badge-${c.difficulty.toLowerCase()}">${c.difficulty}</span>
                        ${c.solved ? '<span class="badge badge-easy">✅ YECHILGAN</span>' : ''}
                    </div>
                    <h1 style="margin: 0;">${c.title}</h1>
                </div>
                <div style="text-align: right;">
                    <div style="font-family: JetBrains Mono; font-size: 2rem; color: var(--gold); font-weight: 700;">${c.points}</div>
                    <div style="color: var(--text-muted); font-size: 0.75rem; letter-spacing: 1px;">XP</div>
                </div>
            </div>

            <div style="padding: 24px; background: rgba(30,94,255,0.05); border-left: 4px solid var(--uz-blue); border-radius: 8px; margin-bottom: 24px;">
                <h4 style="margin-bottom: 12px; color: var(--uz-blue);">📖 Story</h4>
                <p style="color: var(--text-secondary); line-height: 1.8;">${c.story || 'Tavsif yo\'q'}</p>
            </div>

            <div style="margin-bottom: 24px;">
                <h4 style="margin-bottom: 12px; color: var(--uz-blue);">🎯 Objective</h4>
                <p style="color: var(--text-secondary); line-height: 1.8;">${c.objective || 'Maqsad ko\'rsatilmagan'}</p>
            </div>

            ${window.renderHints(c)}
        </div>

        ${(c.file || (c.evidence && c.evidence.length > 0)) ? `
            <div class="card-glass fade-in-up" style="padding: 32px; margin-bottom: 24px;">
                <h3 style="margin-bottom: 20px;">📎 Resurslar</h3>
                
                ${c.file ? `
                    <a href="${c.file}" download class="btn btn-primary" style="margin-bottom: 16px; display: inline-flex;">
                        ⬇️ ${c.fileName || 'Fayl yuklab olish'}
                    </a>
                ` : ''}

                ${c.evidence && c.evidence.length > 0 ? `
                    <div style="margin-top: 16px;">
                        <h4 style="margin-bottom: 12px; color: var(--text-secondary); font-size: 0.85rem;">Dalillar:</h4>
                        <ul style="list-style: none; padding: 0;">
                            ${c.evidence.map(e => `
                                <li style="padding: 10px 16px; background: var(--surface); border: 1px solid rgba(30,94,255,0.1); border-radius: 8px; margin-bottom: 8px; font-family: JetBrains Mono; font-size: 0.85rem; color: var(--accent-cyan);">
                                    📄 ${e}
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                ` : ''}
            </div>
        ` : ''}

        <div class="card-glass fade-in-up" style="padding: 32px;">
            <h3 style="margin-bottom: 20px;">🚩 Flagni kiritish</h3>
            
            ${c.solved ? `
                <div style="padding: 20px; background: rgba(22,163,74,0.1); border: 1px solid rgba(22,163,74,0.3); border-radius: 12px; text-align: center;">
                    <div style="font-size: 3rem; margin-bottom: 12px;">🎉</div>
                    <h3 style="color: var(--success); margin-bottom: 8px;">Siz bu challengeni yechgansiz!</h3>
                    ${(() => {
        let spentXP = 0;
        if (c.hints && c.hints.length > 0) {
            c.hints.forEach((h, i) => {
                const text = typeof h === 'object' ? (h.text || '') : h;
                const isUnlocked = h.isUnlocked || (text && text !== 'LOCKED' && text !== 'HIDDEN');
                if (isUnlocked) {
                    const rate = i === 0 ? 0.20 : (i === 1 ? 0.40 : 0.50);
                    spentXP += Math.round((c.points || 100) * rate);
                }
            });
        }
        const netXP = (c.points || 100) - spentXP;
        
        let ui = '<div style="color: var(--text-secondary); font-size: 0.95rem; line-height: 1.8; text-align: left; background: rgba(0,0,0,0.2); padding: 16px; border-radius: 8px; display: inline-block; margin-top: 10px; min-width: 240px;">';
        ui += '<div style="display: flex; justify-content: space-between; gap: 24px;"><span>Asosiy ball:</span> <strong style="color: #10B981;">+' + (c.points||100) + ' XP</strong></div>';
        
        if (spentXP > 0) {
            ui += '<div style="display: flex; justify-content: space-between; gap: 24px; border-bottom: 1px dashed rgba(255,255,255,0.15); padding-bottom: 8px; margin-bottom: 8px;"><span>Ishlatilgan ishoralar:</span> <strong style="color: #EF4444;">-' + spentXP + ' XP</strong></div>';
        } else {
            ui += '<div style="margin-top: 8px;"></div>';
        }
        
        ui += '<div style="display: flex; justify-content: space-between; gap: 24px; font-size: 1.15rem;"><span style="color: #fff;">Sof yutuq:</span> <strong style="color: #3B82F6;">+' + netXP + ' XP</strong></div>';
        ui += '</div>';
        
        return ui;
    })()}
                </div>
            ` : `
                <div class="input-group">
                    <input type="text" id="flag-input" placeholder="CTF{...}" 
                        style="font-family: JetBrains Mono; font-size: 1rem;">
                    <label>Flag</label>
                    <span class="hint">Format: CTF{...}</span>
                </div>
                <button id="submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 16px;">
                    Flagni yuborish →
                </button>
                <div id="submit-message" class="msg-box"></div>
            `}
        </div>
    `;

    if (!c.solved) {
        document.getElementById('submit-btn').addEventListener('click', submitFlag);
        document.getElementById('flag-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitFlag();
        });
    }
}

async function submitFlag() {
    const flag = document.getElementById('flag-input').value.trim();
    const msg = document.getElementById('submit-message');
    const btn = document.getElementById('submit-btn');

    if (!flag) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Flagni kiriting';
        return;
    }

    btn.disabled = true;
    btn.innerText = 'Tekshirilmoqda...';

    try {
        const res = await API.post(`/challenges/${challengeId}/submit`, { flag });

        if (res.success) {
            msg.className = 'msg-box success';
            msg.innerText = '✅ ' + res.message;
            setTimeout(() => loadChallenge(), 1500);
        } else {
            msg.className = 'msg-box error';
            msg.innerText = '❌ ' + res.message;
        }
    } catch (err) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Ulanish xatosi';
    } finally {
        btn.disabled = false;
        btn.innerText = 'Flagni yuborish →';
    }
}

window.addEventListener('load', async () => {
    try {
        const authRes = await fetch('/api/auth/me', { credentials: 'include', cache: 'no-store' });
        if (!authRes.ok) { window.location.replace('/welcome'); return; }
        const authData = await authRes.json();
        if (!authData.success || !authData.user) { window.location.replace('/welcome'); return; }
        
        const authLink = document.getElementById('auth-link');
        if (authLink) {
            authLink.innerHTML = `<img src="${authData.user.avatar || '/assets/default-avatar.svg'}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:1px solid #2563EB;" onerror="this.src='/assets/default-avatar.svg'">${authData.user.username}`;
        }
    } catch (e) {
        window.location.replace('/welcome');
        return;
    }
    
    loadChallenge();
});

</script>
    <script src="/js/preloader.js"></script>
</body>
