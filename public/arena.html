<script>
let allChallenges = [];

// ══════════════════════════════════════════
// CHALLENGES YUKLASH
// ══════════════════════════════════════════
async function loadChallenges() {
    try {
        const res = await fetch('/api/challenges', { credentials: 'include' });
        const data = await res.json();
        
        if (!data.success) {
            if (data.message && data.message.includes('Kirish')) {
                window.location.replace('/welcome');
                return;
            }
            document.getElementById('challenges-list').innerHTML = 
                '<div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-muted);">Challenges yuklanmadi</div>';
            return;
        }
        
        allChallenges = data.challenges || [];
        
        // Stats
        const solved = allChallenges.filter(c => c.solved).length;
        document.getElementById('stat-solved').innerText = solved;
        document.getElementById('stat-total').innerText = allChallenges.length;
        
        renderChallenges('all');
    } catch (e) {
        console.error('loadChallenges xatosi:', e);
    }
}

// ══════════════════════════════════════════
// CHALLENGE KARTALAR
// ══════════════════════════════════════════
function renderChallenges(cat) {
    const list = document.getElementById('challenges-list');
    let filtered = cat === 'all' ? allChallenges : allChallenges.filter(c => c.category === cat);

    if (filtered.length === 0) {
        list.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-muted);">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:48px;height:48px;opacity:0.3;margin-bottom:12px;">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <p style="font-size: 0.9rem;">Bu kategoriyada challenge yo'q</p>
            </div>
        `;
        return;
    }

    list.innerHTML = filtered.map(c => {
        const categoryClass = (c.category || 'web').toLowerCase();
        const difficultyClass = (c.difficulty || 'easy').toLowerCase();
        
        return `
        <div class="challenge-card ${c.solved ? 'solved' : ''} fade-in-up" 
             onclick="window.location.href='/challenge?id=${c.id}'" 
             style="cursor:pointer; position: relative; overflow: hidden;">
            
            ${c.solved ? `
                <div style="position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <svg class="icon icon-check" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </div>
            ` : ''}
            
            <div class="challenge-header">
                <div>
                    <div class="challenge-title">${escapeHtml(c.title)}</div>
                </div>
                <div class="challenge-points" style="display: flex; align-items: center; gap: 6px;">
                    <svg class="icon icon-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                    ${c.points} XP
                </div>
            </div>
            
            <div class="challenge-meta">
                <span class="badge badge-${categoryClass}">${escapeHtml(c.category || 'Web')}</span>
                <span class="badge badge-${difficultyClass}">${escapeHtml(c.difficulty || 'Easy')}</span>
                ${c.solved ? `
                    <span class="badge badge-easy" style="display: inline-flex; align-items: center; gap: 4px;">
                        <svg class="icon icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                        YECHILGAN
                    </span>
                ` : ''}
            </div>
            
            <div class="challenge-story">${escapeHtml(c.story || 'Tavsif yo\'q')}</div>
            
            <div class="challenge-footer">
                <span style="color: var(--text-muted); font-size: 0.75rem; display: flex; align-items: center; gap: 6px;">
                    ${c.solved 
                        ? `<svg class="icon icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;"><polyline points="20 6 9 17 4 12"/></svg> Yechilgan`
                        : `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Yechilmagan`
                    }
                </span>
                <span style="color: var(--uz-blue); font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; gap: 4px;">
                    ENTER
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </span>
            </div>
        </div>
        `;
    }).join('');
}

// ══════════════════════════════════════════
// FILTER
// ══════════════════════════════════════════
function filterChallenges(cat, el) {
    document.querySelectorAll('#filter-bar button').forEach(b => {
        b.className = b.className.replace('btn-primary', 'btn-secondary');
    });
    el.className = el.className.replace('btn-secondary', 'btn-primary');
    renderChallenges(cat);
}

// ══════════════════════════════════════════
// ESCAPE (XSS HIMOYA)
// ══════════════════════════════════════════
function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

// ══════════════════════════════════════════
// SAHIFA YUKLANGANDA
// ══════════════════════════════════════════
window.addEventListener('load', async () => {
    try {
        const authRes = await fetch('/api/auth/me', { credentials: 'include', cache: 'no-store' });
        if (!authRes.ok) {
            window.location.replace('/welcome');
            return;
        }
        const authData = await authRes.json();
        if (!authData.success || !authData.user) {
            window.location.replace('/welcome');
            return;
        }
        
        const authLink = document.getElementById('auth-link');
        if (authLink) {
            authLink.innerHTML = `<img src="${authData.user.avatar || '/assets/default-avatar.svg'}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:1px solid #2563EB;" onerror="this.src='/assets/default-avatar.svg'">${authData.user.username}`;
        }
    } catch (e) {
        window.location.replace('/welcome');
        return;
    }
    
    loadChallenges();
});
</script>
