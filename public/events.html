  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/assets/icon-192.png">

<body>

<div class="girih-bg"></div>

<header class="header">
    <a href="/" class="logo">
<img src="/assets/brand/ctf-uz-mark.svg" alt="CTF.UZ" style="width:34px;height:34px;border-radius:8px;">
<div class="logo-text">CTF<span>.UZ</span></div>
</a>
    
    <nav class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/arena">Arena</a>
        <a href="/learn">O'rganish</a>

        <a href="/leaderboard">Reyting</a>
        <a href="/career">Karyera</a>
        <a id="auth-link" href="/profile"></a>
    </nav>

</header>

<div class="container">
    <div style="text-align: center; margin-bottom: 60px;">
        <h1 style="margin-bottom: 16px;">Events</h1>
        <p style="color: var(--text-secondary); max-width: 600px; margin: 0 auto; font-size: 1.05rem; line-height: 1.8;">
            Milliy chempionatlar, universitet kubogi, Red vs Blue, Cyber Week.
        </p>
    </div>

    <div id="events-list" style="display: grid; gap: 24px;">
        <div class="spinner"></div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>
<script>
window.addEventListener('load', async () => {
    try {
        const authRes = await fetch('/api/auth/me', { credentials: 'include', cache: 'no-store' });
        if (!authRes.ok) { window.location.replace('/welcome'); return; }
        const authData = await authRes.json();
        if (!authData.success || !authData.user) { window.location.replace('/welcome'); return; }
        
        const authLink = document.getElementById('auth-link');
        if (authLink) {
            authLink.innerHTML = `<img src="${authData.user.avatar || '/assets/default-avatar.svg'}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:1px solid #2563EB;" onerror="this.src='/assets/default-avatar.svg'">${authData.user.username}`;
        }
    } catch (e) {
        window.location.replace('/welcome');
        return;
    }
    
    loadEvents();
});

async function loadEvents() {
    const res = await API.get('/events');
    if (!res.success) return;

    document.getElementById('events-list').innerHTML = res.events.map(e => {
        const startDate = new Date(e.startDate).toLocaleDateString('uz-UZ');
        const isLive = e.status === 'live';
        return `
            <div class="card-glass fade-in-up" style="display: grid; grid-template-columns: 100px 1fr auto; gap: 32px; align-items: center; padding: 32px;">
                <div style="font-size: 3rem; text-align: center;">${e.icon}</div>
                <div>
                    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
                        <h3 style="margin: 0;">${e.title}</h3>
                        ${isLive ? '<span class="badge" style="background: rgba(239,68,68,0.15); color: var(--error);"><span class="live-pulse"></span>LIVE</span>' : ''}
                    </div>
                    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 12px;">${e.description}</p>
                    <div style="display: flex; gap: 20px; font-size: 0.8rem; color: var(--text-muted); font-family: JetBrains Mono;">
                        <span><i data-lucide="calendar" class="icon-date"></i> ${startDate}</span>
                        <span><i data-lucide="users" class="icon-users"></i> ${e.participants} participants</span>
                    </div>
                </div>
                <div>
                    <button class="btn btn-primary" onclick="joinEvent(${e.id})">Join →</button>
                </div>
            </div>
        `;
    }).join('');
}

async function joinEvent(id) {
    const res = await API.post(`/events/${id}/join`);
    alert(res.message);
    loadEvents();
}
</script>
    <script src="/js/preloader.js"></script>
