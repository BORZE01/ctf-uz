<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parolni tiklash — CTF.UZ</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="girih-bg"></div>

<div class="container-narrow">
    <div class="card-glass" style="max-width: 480px; margin: 80px auto; padding: 40px;">
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="font-size: 3rem; margin-bottom: 16px;">🔓</div>
            <h2 style="font-family: Manrope; margin-bottom: 8px;">Parolni tiklash</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Email manzilingizni kiriting</p>
        </div>

        <form id="forgot-form">
            <div class="input-group">
                <input type="email" id="email" placeholder=" " required>
                <label>Email manzil</label>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Yuborish</button>
        </form>

        <div id="forgot-message" class="msg-box"></div>

        <p style="text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 0.85rem;">
            <a href="/login" style="color: var(--uz-blue);">← Kirishga qaytish</a>
        </p>
    </div>
</div>

<script>
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const msg = document.getElementById('forgot-message');

    try {
        const res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await res.json();
        msg.className = 'msg-box success';
        msg.innerText = '✅ ' + data.message;
    } catch (err) {
        msg.className = 'msg-box error';
        msg.innerText = '❌ Ulanish xatosi';
    }
});
</script>
</body>
</html>
