<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'rganish — CTF.UZ</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/modern-ui.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/preloader.css">
    <style>
        .learn-view { display: none; }
        .learn-view.active { display: block; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .breadcrumb-bar {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            background: rgba(15, 22, 41, 0.75); border: 1px solid rgba(74, 127, 255, 0.16);
            padding: 12px 18px; border-radius: 12px; margin-bottom: 24px; flex-wrap: wrap;
        }
        .bc-btn {
            display: inline-flex; align-items: center; gap: 8px; background: rgba(37, 99, 235, 0.12);
            border: 1px solid rgba(74, 127, 255, 0.3); color: #F1F5F9; padding: 8px 14px;
            border-radius: 8px; font-size: 0.84rem; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .bc-btn:hover { background: #2563EB; border-color: #4A7FFF; }

        .prog-track { height: 8px; background: rgba(6, 11, 24, 0.9); border: 1px solid rgba(74, 127, 255, 0.18); border-radius: 999px; overflow: hidden; margin: 12px 0; }
        .prog-bar-fill { height: 100%; background: linear-gradient(90deg, #2563EB, #22D3EE); transition: width 0.35s ease; }

        .step-card {
            background: #0F1629; border: 1px solid rgba(74, 127, 255, 0.16); border-radius: 16px;
            padding: 22px 24px; margin-bottom: 16px; display: flex; justify-content: space-between;
            align-items: center; gap: 20px; transition: 0.25s; position: relative;
        }
        .step-card:hover:not(.locked-item) { border-color: rgba(74, 127, 255, 0.45); transform: translateY(-2px); }
        .step-card.completed-item { border-color: rgba(16, 185, 129, 0.4); background: linear-gradient(145deg, #0F1629, rgba(16, 185, 129, 0.05)); }
        .step-card.locked-item { opacity: 0.55; background: rgba(10, 16, 32, 0.6); }

        .step-num {
            width: 44px; height: 44px; border-radius: 12px; background: rgba(37, 99, 235, 0.14);
            border: 1px solid rgba(74, 127, 255, 0.3); display: flex; align-items: center;
            justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 700;
            color: #4A7FFF; flex-shrink: 0;
        }
        .completed-item .step-num { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.45); color: #10B981; }

        /* SERTIFIKAT OLINGANDAGI BLUR VA QULF QATLAMI */
        .completed-path-wrapper { position: relative; }
        .completed-path-blur {
            filter: blur(4px); pointer-events: none; user-select: none; opacity: 0.45; transition: 0.3s;
        }
        .completed-lock-overlay {
            position: absolute; inset: 0; z-index: 10; display: flex; align-items: center;
            justify-content: center; padding: 24px;
        }
        .completed-lock-badge {
            background: rgba(10, 16, 32, 0.94); border: 1px solid rgba(16, 185, 129, 0.5);
            border-radius: 16px; padding: 28px 36px; text-align: center; max-width: 520px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75); backdrop-filter: blur(12px);
        }

        .cert-showcase {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(37, 99, 235, 0.12));
            border: 2px solid rgba(16, 185, 129, 0.45); border-radius: 18px; padding: 28px;
            margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 20px;
        }

        .lesson-reader {
            background: #0F1629; border: 1px solid rgba(74, 127, 255, 0.2); border-radius: 16px;
            padding: 32px; margin-bottom: 28px; line-height: 1.75; color: #E2E8F0;
        }
        .lesson-reader h3, .lesson-reader h2 { font-family: 'Manrope', sans-serif; color: #FFFFFF; margin: 16px 0 10px; }
        .lesson-reader code { background: #060B18; padding: 3px 8px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; color: #22D3EE; border: 1px solid rgba(74, 127, 255, 0.2); }

        .question-box {
            background: #0A1020; border: 1px solid rgba(74, 127, 255, 0.2); border-radius: 14px;
            padding: 22px; margin-bottom: 16px;
        }
        .question-box.solved-q { border-color: rgba(16, 185, 129, 0.45); background: rgba(16, 185, 129, 0.05); }
        .q-input {
            flex: 1; padding: 12px 16px; background: #060B18; border: 1px solid rgba(74, 127, 255, 0.28);
            border-radius: 10px; color: #fff; font-family: 'Inter', sans-serif; outline: none;
        }
        .q-input:focus { border-color: #4A7FFF; }
        .exam-opt {
            display: flex; align-items: center; gap: 12px; padding: 13px 16px; background: #060B18;
            border: 1px solid rgba(74, 127, 255, 0.18); border-radius: 10px; margin-top: 8px;
            cursor: pointer; transition: 0.2s; color: #E2E8F0;
        }
        .exam-opt:hover { border-color: #4A7FFF; background: rgba(37, 99, 235, 0.08); }
    </style>

<script id="session-guard">
document.addEventListener("DOMContentLoaded", () => {
    fetch('/api/auth/session')
        .then(res => res.json())
        .then(data => { if (!data.success || !data.user) window.location.href = '/welcome'; })
        .catch(() => window.location.href = '/welcome');
});
</script>
</head>
<body>

<div class="girih-bg"></div>

<header class="header">
    <a href="/" class="logo">
        <div class="logo-mark">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
        </div>
        <div class="logo-text">CTF<span>.UZ</span></div>
    </a>
    
    <nav class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/arena">Arena</a>
        <a href="/learn" class="active">O'rganish</a>
        <a href="/battle">Battle</a>
        <a href="/leaderboard">Reyting</a>
        <a href="/career">Karyera</a>
        <a id="auth-link" href="/profile"></a>
    </nav>
</header>

<div class="container">

    <!-- ======================================================== -->
    <!-- 1-BOSQICH: O'QUV YO'LLARI RO'YXATI                       -->
    <!-- ======================================================== -->
    <div id="view-paths" class="learn-view active">
        <div style="display: flex; justify-content: space-between; align-items: end; margin-bottom: 32px; flex-wrap: wrap; gap: 16px;">
            <div>
                <h1 style="margin-bottom: 8px; display: flex; align-items: center; gap: 12px;">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:36px;height:36px;color:#4A7FFF;">
                        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
                    </svg>
                    O'quv Yo'llari
                </h1>
                <p style="color: var(--text-secondary);">Bosqichma-bosqich modullarni yakunlang, yakuniy imtihondan o'ting va rasmiy sertifikatga ega bo'ling.</p>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <a href="/certificate-verify" class="btn btn-secondary btn-sm" style="display: inline-flex; align-items: center; gap: 8px;">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    Sertifikatni tekshirish
                </a>
            </div>
        </div>

        <div id="paths-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px;"></div>
    </div>

    <!-- ======================================================== -->
    <!-- 2-BOSQICH: TANLANGAN YO'L ICHIDAGI MODULLAR VA IMTIHON    -->
    <!-- ======================================================== -->
    <div id="view-path-detail" class="learn-view">
        <div class="breadcrumb-bar">
            <button class="bc-btn" onclick="showView('view-paths'); loadPathsList();">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Barcha o'quv yo'llariga qaytish
            </button>
            <div id="path-header-meta" style="font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: #94A3B8;"></div>
        </div>

        <div id="path-detail-container"></div>
    </div>

    <!-- ======================================================== -->
    <!-- 3-BOSQICH: TANLANGAN MODUL ICHIDAGI DARSLAR RO'YXATI      -->
    <!-- ======================================================== -->
    <div id="view-module-detail" class="learn-view">
        <div class="breadcrumb-bar">
            <button class="bc-btn" onclick="backToCurrentPath()">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Modullar ro'yxatiga qaytish
            </button>
            <div id="module-header-meta" style="font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: #94A3B8;"></div>
        </div>

        <div id="module-detail-container"></div>
    </div>

    <!-- ======================================================== -->
    <!-- 4-BOSQICH: DARS MATNI VA SAVOL-JAVOBLAR                  -->
    <!-- ======================================================== -->
    <div id="view-lesson-detail" class="learn-view">
        <div class="breadcrumb-bar">
            <button class="bc-btn" onclick="backToCurrentModule()">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Modul darslariga qaytish
            </button>
            <div id="lesson-header-meta" style="font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: #94A3B8;"></div>
        </div>

        <div id="lesson-detail-container"></div>
    </div>

    <!-- ======================================================== -->
    <!-- 5-BOSQICH: YAKUNIY IMTIHON SAHIFASI                      -->
    <!-- ======================================================== -->
    <div id="view-final-exam" class="learn-view">
        <div class="breadcrumb-bar">
            <button class="bc-btn" onclick="backToCurrentPath()">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                O'quv yo'liga qaytish
            </button>
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: #F59E0B;">YAKUNIY SERTIFIKAT IMTIHONI</div>
        </div>

        <div id="exam-detail-container"></div>
    </div>

</div>

<script src="/js/learn-app.js"></script>
<script src="/js/preloader.js"></script>
</body>
</html>
