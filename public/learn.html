<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'rganish — CTF.UZ</title>
    <!-- ARENA BILAN BIR XIL CSS FAYLLAR -->
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/modern-ui.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/preloader.css">
</head>
<body>

<div class="girih-bg"></div>

<header class="header">
    <a href="/" class="logo">
        <div class="logo-mark">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
        </div>
        <div class="logo-text">CTF<span>.UZ</span></div>
    </a>
    <nav class="nav">
        <a href="/dashboard" data-page="dashboard">Dashboard</a>
        <a href="/arena" data-page="arena">Arena</a>
        <a href="/learn" data-page="learn" class="active">O'rganish</a>
        <a href="/battle" data-page="battle">Battle</a>
        <a href="/leaderboard" data-page="leaderboard">Reyting</a>
        <a href="/career" data-page="career">Karyera</a>
        <a id="auth-link" href="/profile" data-page="profile"></a>
    </nav>
</header>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: end; margin-bottom: 32px; flex-wrap: wrap; gap: 16px;">
        <div>
            <h1 style="margin-bottom: 8px; display: flex; align-items: center; gap: 12px;">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:36px;height:36px;color:#00c8ff;">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
                O'quv Modullari
            </h1>
            <p style="color: var(--text-secondary);">Kiberxavfsizlik akademiyasi. Darslarni o'qing, XP yig'ing va sertifikat oling.</p>
        </div>
        <div id="arena-stats" style="display: flex; gap: 16px; flex-wrap: wrap;">
            <div style="background: rgba(74, 127, 255, 0.06); border: 1px solid rgba(74, 127, 255, 0.15); border-radius: 12px; padding: 10px 16px;">
                <div style="font-size: 0.65rem; color: var(--text3); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700;">Tugatilgan</div>
                <div style="font-family: Manrope; font-size: 1.3rem; font-weight: 900; color: #10B981;" id="stat-solved">0</div>
            </div>
            <div style="background: rgba(74, 127, 255, 0.06); border: 1px solid rgba(74, 127, 255, 0.15); border-radius: 12px; padding: 10px 16px;">
                <div style="font-size: 0.65rem; color: var(--text3); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700;">Jami darslar</div>
                <div style="font-family: Manrope; font-size: 1.3rem; font-weight: 900; color: #4A7FFF;" id="stat-total">0</div>
            </div>
        </div>
    </div>

    <!-- MODULES AND LESSONS LIST -->
    <div id="modules-list">
        <!-- Skeleton Loaders -->
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px;">
            <div class="skeleton-challenge"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text long"></div><div class="skeleton skeleton-text medium"></div></div>
            <div class="skeleton-challenge"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text long"></div><div class="skeleton skeleton-text medium"></div></div>
            <div class="skeleton-challenge"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text long"></div><div class="skeleton skeleton-text medium"></div></div>
        </div>
    </div>
</div>

<script>
// XSS himoyasi
function escapeHtml(text) {
    if (!text) return '';
    return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

window.addEventListener('load', async () => {
    // 1. Profil ma'lumotlarini yuklash (Navbar uchun)
    try {
        const authRes = await fetch('/api/auth/me', { credentials: 'include', cache: 'no-store' });
        if (authRes.ok) {
            const authData = await authRes.json();
            if (authData.success && authData.user) {
                const authLink = document.getElementById('auth-link');
                if (authLink) {
                    authLink.innerHTML = `<img src="${authData.user.avatar || '/assets/default-avatar.svg'}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:1px solid #2563EB;" onerror="this.src='/assets/default-avatar.svg'">${authData.user.username}`;
                }
            }
        }
    } catch (e) { console.log("Profile error"); }

    // 2. Modullar va Darslarni yuklash
    try {
        const res = await fetch('/api/learn/modules');
        const data = await res.json();
        
        if (!data.success) {
            document.getElementById('modules-list').innerHTML = '<div style="text-align: center; padding: 60px; color: var(--text-muted);">Darslar topilmadi</div>';
            return;
        }

        document.getElementById('stat-solved').innerText = data.stats?.completedLessons || 0;
        document.getElementById('stat-total').innerText = data.stats?.totalLessons || 0;

        let html = '';
        data.data.forEach((mod, mIndex) => {
            html += `
            <div style="margin-bottom: 48px;">
                <h2 style="font-size: 1.3rem; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; color: #fff;">
                    ${mIndex + 1}-modul. ${escapeHtml(mod.title)}
                </h2>
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px;">
            `;

            mod.lessons.forEach((les, idx) => {
                const isCompleted = les.status === 'completed';
                const isStarted = les.status === 'started';
                
                // Arena kartochkasi dizayni 100% nusxalangan
                html += `
                <div class="challenge-card ${isCompleted ? 'solved' : ''} fade-in-up" 
                     onclick="window.location.href='/learn/${mod.slug}/${les.slug}'" 
                     style="cursor:pointer; position: relative; overflow: hidden;">
                    
                    ${isCompleted ? `
                        <div style="position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                            <svg class="icon icon-check" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                        </div>
                    ` : ''}
                    
                    <div class="challenge-header">
                        <div>
                            <div class="challenge-title">${idx + 1}. ${escapeHtml(les.title)}</div>
                        </div>
                        <div class="challenge-points" style="display: flex; align-items: center; gap: 6px;">
                            <svg class="icon icon-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
                                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                            </svg>
                            ${les.xpReward || 50} XP
                        </div>
                    </div>
                    
                    <div class="challenge-meta">
                        <span class="badge badge-web">${escapeHtml(mod.category || 'Fundamentals')}</span>
                        <span class="badge badge-easy">${escapeHtml(mod.difficulty || 'Beginner')}</span>
                        <span class="badge" style="background: rgba(255,255,255,0.05); color: #94A3B8;">⏱ ${les.duration || 15} min</span>
                    </div>
                    
                    <div class="challenge-story" style="flex-grow: 1;">${escapeHtml(les.description || 'Darsning qisqacha tavsifi bu yerda ko\'rsatiladi.')}</div>
                    
                    <div class="challenge-footer">
                        <span style="color: var(--text-muted); font-size: 0.75rem; display: flex; align-items: center; gap: 6px;">
                            ${isCompleted 
                                ? '<svg class="icon icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;"><polyline points="20 6 9 17 4 12"/></svg> Yechilgan'
                                : (isStarted ? '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;"><polygon points="5 3 19 12 5 21 5 3"/></svg> <span style="color: #F59E0B">Jarayonda</span>'
                                : '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Yechilmagan')
                            }
                        </span>
                        <span style="color: var(--uz-blue); font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; gap: 4px;">
                            ${isCompleted ? 'QAYTA KO\'RISH' : (isStarted ? 'DAVOM ETTIRISH' : 'ENTER')}
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;">
                                <path d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>
                        </span>
                    </div>
                </div>`;
            });
            html += `</div></div>`;
        });
        
        document.getElementById('modules-list').innerHTML = html;
    } catch (e) { console.error('Learn modules xatosi:', e); }
});
</script>
<script src="/js/preloader.js"></script>
</body>
</html>
